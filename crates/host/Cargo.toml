[package]
name = "natemu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
natemu-abi = { path = "../abi" }
virtio-queue = { git = "https://github.com/ArArgon/natemu-rust-vmm", rev = "5ede8fee887e2a39b3f4efe8822c85158d412120" }
vm-memory = { git = "https://github.com/ArArgon/natemu-rust-vmm", rev = "5ede8fee887e2a39b3f4efe8822c85158d412120", features = ["backend-mmap"] }

[features]
# Test drivers only (crates/driver): raw writes into a vCPU's records and code cache, and the hook's reply, object and
# compile-server calls and arbitrary system replies. Build the `natemu` stub alone (`-p natemu-cli`) to leave it out.
testing = []
# Isolated native scheduling fixtures only; absent from normal CLI and normal stress.
io-test-hooks = ["testing"]
