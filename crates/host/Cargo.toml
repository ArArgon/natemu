[package]
name = "natemu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
natemu-abi = { path = "../abi" }
serde.workspace = true
serde_json.workspace = true

[features]
# Test drivers only (crates/driver): raw writes into a vCPU's records and code cache, and the hook's reply, object and
# compile-server calls and arbitrary system replies. Build the `natemu` stub alone (`-p natemu-cli`) to leave it out.
testing = []
# Isolated native scheduling fixtures only; absent from normal CLI and normal stress.
io-test-hooks = ["testing"]
