[package]
name = "natemu-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# The `natemu` boot stub, a package apart from the library so the library takes no clap dependency (dependency policy:
# docs/restructure/boot-handoff.md §1; the library's one exception is the pinned rust-vmm fork and its locked dependencies).
# Build it alone (`-p natemu-cli`): no `testing` feature.
[dependencies]
natemu = { path = "../host" }
clap.workspace = true

[[bin]]
name = "natemu"
path = "src/main.rs"
