[package]
name = "natemu-viewer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# A window on a running natemu's display: a client of its control socket (docs/control-api.md) that maps the
# framebuffer and sends keyboard and mouse input (docs/viewer.md).
# The window is macOS only: winit and softbuffer are macOS dependencies, and elsewhere the binary is a stub that says so,
# so the viewer stays a default member and a plain `cargo build` builds it on the Mac and still works on other hosts.
# winit opens the window and reads the keyboard and mouse; softbuffer puts the pixels in it (both MIT or Apache-2.0).
[dependencies]
serde_json.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "=0.4.8", default-features = false }

[[bin]]
name = "natemu-viewer"
path = "src/main.rs"
