[package]
name = "natemu-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
natemu-abi = { path = "../abi" }

# Performance phase, first chunk: the resident's time accounting (`src/perf.rs`); off by default (no code).
[features]
# What the resident does by default: the dispatcher's data tables (`data-l1`) and the hot/cold block layout (`hot-cold`, on
# `no-tail`). The old forms (dispatcher tables as code, whole blocks with FEX's tail) remain buildable with
# `--no-default-features`, for comparison runs only.
default = ["data-l1", "no-tail", "hot-cold"]
perf = []
# Dispatch study, measurement builds only: counts L1 evictions, skipped fills and misses by the L1 entry they found
# (`Control::l1_counts`). Kept out of plain `perf`: the extra loads and stores in the lookup and miss paths showed in the gates.
dispatch-study = ["perf"]
# Page-currency plan chunk 0 (docs/restructure/page-currency-plan.md section 8), measurement builds only: a per-vCPU record of
# fetch-walk results (`natemu_abi::page_study`) probed in shadow mode at every fetch walk (the walk is still made, the record's
# answer compared with it, a miss recorded), with counters and walk timings (`Control::page_study`). Never part of `perf`: its
# loads and timestamps would show in the gates (decision 16).
page-study = ["perf"]
# PCID gain study, measurement builds only (`src/study.rs`): models the TLB a PCID guest would keep across CR3 loads and counts
# the shadow misses and block revalidations that were refills (`Control::pcid_study`).
pcid-study = ["perf"]
# Page-validity experiment, measurement builds only (`cache::page_valid`): a revalidation makes current the other blocks on
# its page too (those last current in the same epoch; all of them with NATEMU_PAGE_VALID_ALL set at build time).
page-valid = []
# Jump-check experiment, measurement builds only (`cache::vt`): a dispatcher slot checks its target's code page in a
# per-table validity table before probing L1, so a CR3 load clears that table and leaves L1 entries of one-page blocks.
# Builds on `data-l1` (a default feature; with `--no-default-features` add it).
jump-check = []
# Trap-cost study, measurement builds only: counts and times every code synchronization (`cache::synchronize_code`) in the
# page-validity experiment's two counter slots.
sync-time = []
# The dispatcher's tables are data the slots load from (`cache::dl1`), not code, so filling or emptying an entry writes and
# synchronizes no code. On by default; without it (`--no-default-features`) the tables are code, kept for comparison.
data-l1 = []
# Translated-code profile, measurement builds only (`study::prof`): at every interrupt taken in generated code, where the
# vCPU was (dispatcher, a block's header, body or exits), in whose code (user or kernel), on what kind of instruction, and
# a table of the blocks hit most (the host rings each vCPU's doorbell every NATEMU_SAMPLE_US microseconds to sample).
profile = []
# Blocks are placed without FEX's tail (its data words after the code) and packed at 16 bytes (`cache::placed_size`); word 0 of
# an admitted object is then the placed length. On by default.
no-tail = []
# Hot/cold layout (`cache::split`): a block's words up to its first exit are copied into a dense hot stream where it is entered;
# its whole code stays in the segment's cold part. On by default; `pic-count` cannot be combined with it (use
# `--no-default-features`).
hot-cold = ["no-tail"]
# Isolated scheduling fixtures; no calls or metadata accesses when disabled.
io-test-hooks = []
# PIC study stage 1, measurement builds only: links enter their targets through counting stubs (`cache::stub`), for linked
# transitions by class. The stubs use guest-state fields and links the program driver's checks refuse: no suite runs them.
pic-count = []
# Chunk 1b, check builds only: after an INVLPG cut no non-local link is left into the block, after a death none at all
# (`cache::check_inbound`; stop `link_check`).
link-check = []

[[bin]]
name = "natemu-runtime"
path = "src/main.rs"
test = false
bench = false
