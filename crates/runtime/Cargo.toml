[package]
name = "natemu-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
natemu-abi = { path = "../abi" }

[[bin]]
name = "natemu-runtime"
path = "src/main.rs"
test = false
bench = false

[features]
# Regression families for the I1–I4/I4-V runners; the default image is the general resident.
families = ["natemu-abi/families"]
