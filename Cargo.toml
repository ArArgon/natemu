[workspace]
members = ["crates/abi", "crates/host", "crates/cli", "crates/driver", "crates/runtime", "crates/qcow"]
default-members = ["crates/abi", "crates/host", "crates/cli", "crates/driver"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"

# Host binaries use clap from crates.io, pinned in Cargo.lock; the host library and test driver write their JSON
# reports with serde and serde_json (likewise pinned).
# The resident and ABI remain free of registry dependencies.
[workspace.dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
log = "=0.4.35"
# The CLI alone (the configuration file, crates/cli/src/config.rs).
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde"] }
serde_path_to_error = "=0.1.20"
# natemu-qcow (vendored Cloud Hypervisor code)
bitflags = "=2.13.2"
libc = "=0.2.191"
zerocopy = { version = "=0.8.63", default-features = false }

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"

# Bounded resident text: avoid unrolling volatile architectural-state copies.
[profile.release.package.natemu-runtime]
opt-level = "s"
