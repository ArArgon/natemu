[workspace]
members = ["crates/abi", "crates/host", "crates/driver", "crates/runtime"]
default-members = ["crates/abi", "crates/host", "crates/driver"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"

# Bounded resident text: avoid unrolling volatile architectural-state copies.
[profile.release.package.natemu-runtime]
opt-level = "s"
