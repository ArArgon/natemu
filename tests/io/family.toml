# Generated by `python3 -m testkit.migrate` from tools/run_suite.py (spec R13): the io runners, each case one
# unchanged runner invocation with inputs from the input root and QEMU answers locked. Only the `io` suite is generated: io-selfcheck, io-program and io-campaign below are written by hand, and
# regenerating overwrites this file, so put them back (testkit/tests/test_runner.py checks they are here).
[family]
name = "io"
covers = ["crates/**", "third_party/FEX", "tools/**"]

[[suite]]
name = "io"
kind = "judged"
harness = "runner"
params = { timeout = 3600 }

[suite.cases."virtio-lifecycle"]
argv = ["tools/run_virtio_lifecycle.py", "run", "--host", "{natemu_host}", "--no-lock", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}", "--cases", "read-error", "write-error", "malformed", "malformed-later", "fullqueue", "table-page", "batch-read-error", "batch-write-error", "flush-error", "flush-error-power", "sync-error-writethrough"]
needs = { perf = true }
smoke = true

[suite.cases."virtio-lifecycle-timed"]
argv = ["tools/run_virtio_lifecycle.py", "run", "--host", "{natemu_host}", "--no-lock", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}", "--cases", "reset", "disable", "power-scalar", "power-rep", "power-sync-error", "power-rep-halt", "out-of-order", "cancel-batch", "reset-mixed", "code-page", "drain-expiry"]
needs = { exclusive = true, why = "held-call schedules released or timed out at 3 s, the 50 ms windowless drain deadline (code-page: none may expire), a fixed guest delay against a 300 ms port exit (drain-expiry)" }
smoke = true
rerun = true

[suite.cases."io-coverage"]
argv = ["tools/run_io_coverage.py", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

[suite.cases."io-coverage-pci"]
argv = ["tools/run_io_coverage.py", "--transport", "pci", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

[suite.cases."io-coverage-qcow2"]
argv = ["tools/run_io_coverage.py", "--cases", "qcow2", "qcow2-trim", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }

[suite.cases."io-coverage-overlay"]
argv = ["tools/run_io_coverage.py", "--cases", "overlay", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }

[suite.cases."io-coverage-multidisk"]
argv = ["tools/run_io_coverage.py", "--cases", "multidisk", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }

[suite.cases."io-coverage-readonly"]
argv = ["tools/run_io_coverage.py", "--cases", "readonly", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }

[suite.cases."io-coverage-sharedintx"]
argv = ["tools/run_io_coverage.py", "--cases", "sharedintx", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4, perf = true }

[suite.cases."net-linux"]
argv = ["tools/run_net_linux.py", "run", "--offline", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

[suite.cases."net-linux-pci"]
argv = ["tools/run_net_linux.py", "run", "--offline", "--transport", "pci", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

# The two stress runners' --self-check: assembly and the oracles' negative controls, no VM. (Its own suite: the
# migration test compares the `io` suite's cases with tools/run_suite.py's steps.)
[[suite]]
name = "io-selfcheck"
kind = "judged"
harness = "runner"
params = { timeout = 300 }

[suite.cases."io-stress-selfcheck"]
argv = ["tools/run_io_stress.py", "--self-check"]
smoke = true

[suite.cases."lifecycle-stress-selfcheck"]
argv = ["tools/run_io_lifecycle_stress.py", "--self-check"]
smoke = true

[suite.cases."virtio-net-selfcheck"]
argv = ["tools/run_virtio_net.py", "self-check"]
smoke = true

[suite.cases."io-pending-compiler-selfcheck"]
argv = ["tools/run_io_pending_compiler.py", "self-check"]
smoke = true

# Small guest programs through the program driver (run-program), each VM a second or less: the virtio network device
# with an echo endpoint instead of a real network, and host I/O copying into guest memory while the guest runs (copy
# windows). Written by hand, like io-selfcheck: tools/run_suite.py never ran these four runners. Each judges its own
# cases (no QEMU answers) and stops at its first failing case, so the cases after a failure are not reported.
[[suite]]
name = "io-program"
kind = "judged"
harness = "runner"
params = { timeout = 900 }

[suite.cases."virtio-net"]
argv = ["tools/run_virtio_net.py", "run", "--host", "{natemu_host}", "--no-lock", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

[suite.cases."io-windows"]
argv = ["tools/run_io_windows.py", "--host", "{natemu_host}", "--no-lock", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4, perf = true }
smoke = true

[suite.cases."io-window-cases"]
argv = ["tools/run_io_window_cases.py", "--host", "{natemu_host}", "--no-lock", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }
smoke = true

[suite.cases."io-pending-compiler"]
argv = ["tools/run_io_pending_compiler.py", "run", "--host", "{natemu_host}", "--no-lock", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }
results = "result.json"
smoke = true
rerun = true    # the peer vCPU must acknowledge within 400 ms (program_pending.rs): a busy host can miss it once

# Campaign tier: long VM runs (about 120 s each), never in the gate (`natemu-test run --tier campaign tests/io/family.toml`).
# Both runners write out/result.json = {"pass": bool, "errors": [...]}. --forced io-stress needs separately built
# scheduling-hook binaries and is not onboarded.
[[suite]]
name = "io-campaign"
tier = "campaign"
kind = "judged"
harness = "runner"
needs = { exclusive = true, why = "120 s VM with a watchdog: timing-sensitive" }
params = { timeout = 900 }

[suite.cases."io-stress-n2"]
argv = ["tools/run_io_stress.py", "--cpus", "2", "--host", "{natemu_host}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
results = "result.json"

[suite.cases."io-stress-n4"]
argv = ["tools/run_io_stress.py", "--cpus", "4", "--host", "{natemu_host}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
results = "result.json"

[suite.cases."lifecycle-reset"]
argv = ["tools/run_io_lifecycle_stress.py", "--case", "reset", "--host", "{natemu_host}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
results = "result.json"

[suite.cases."lifecycle-disable"]
argv = ["tools/run_io_lifecycle_stress.py", "--case", "disable", "--host", "{natemu_host}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
results = "result.json"

# Negative control: a deliberately corrupted cycle must be caught, so the case passes only when the run fails.
[suite.cases."lifecycle-corrupt-control"]
argv = ["tools/run_io_lifecycle_stress.py", "--case", "reset", "--corrupt-cycle", "17", "--host", "{natemu_host}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
judge = "judges:must_fail"
judge_on_zero = true

# Serial stress and the I/O soak: tools/run_io_campaign.py prepares inputs from the input root's matrix inputs and the pinned
# stress-ng, runs, and writes {"results": [...]} from the runner's own result files.
[suite.cases."serial-unpaced"]
argv = ["tools/run_io_campaign.py", "serial-unpaced", "--host", "{natemu_host}", "--runtime", "{natemu_runtime}", "--natemu", "{natemu_stub}", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "heartbeat gaps of at most 2 s; 5-minute loaded soak" }
results = "results.json"

[suite.cases."serial-paced"]
argv = ["tools/run_io_campaign.py", "serial-paced", "--host", "{natemu_host}", "--runtime", "{natemu_runtime}", "--natemu", "{natemu_stub}", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "heartbeat gaps of at most 2 s; 5-minute loaded soak" }
results = "results.json"

[suite.cases."serial-loaded"]
argv = ["tools/run_io_campaign.py", "serial-loaded", "--host", "{natemu_host}", "--runtime", "{natemu_runtime}", "--natemu", "{natemu_stub}", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "heartbeat gaps of at most 2 s; 5-minute loaded soak" }
results = "results.json"

[suite.cases."soak"]
argv = ["tools/run_io_campaign.py", "soak", "--host", "{natemu_host}", "--runtime", "{natemu_runtime}", "--natemu", "{natemu_stub}", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "heartbeat gaps of at most 2 s; 5-minute loaded soak" }
results = "results.json"
timeout = 2400      # about 9 minutes of VM time (write and verify phases)
