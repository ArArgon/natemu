[resource.qemu-src]
# The QEMU 11.1.2 release tarball (September 29, 2026): the QEMU system-mode reference the runners' expectations assume
# (tools/run_i5b.py, run_k1.py, run_l3.py, run_x3.py), built by testkit.artifacts.qemu_system. download.qemu.org
# publishes no sha file, only a detached signature (qemu-11.1.2.tar.xz.sig): it verified with Michael Roth's release
# key CEACC9E15534EBABB82D3FA03353C9CEF108B584 (from keyserver.ubuntu.com) and the sha256 is of that verified file. The
# Gentoo and Fedora mirrors serve the same bytes (checked).
urls = ["https://download.qemu.org/qemu-11.1.2.tar.xz",
        "https://distfiles.gentoo.org/distfiles/fb/qemu-11.1.2.tar.xz",
        "https://src.fedoraproject.org/repo/pkgs/qemu/qemu-11.1.2.tar.xz/sha512/6e32ebc1adfb5223488fa760a32f900a24a121b3b0637de561f55e3852f3f6fb47ba6e4776320924990d9cebd33d2908f520f017703c4f438dfa528dcb714600/qemu-11.1.2.tar.xz"]
sha256 = "731b5681e4bb18be313231579b8efd0296c5b015fa36dc533874b639ba838016"

[resource.setuptools-wheel]
# setuptools 84.2.1 (October 20, 2026), with wheel below: QEMU's configure requires both in its build venv ([tooling] in
# pythondeps.toml) but its tarball does not ship them, and Homebrew's Python 3.12+ has neither; dropped into the source's
# python/wheels so configure stays offline. sha256 from PyPI's JSON API (pypi.org/pypi/setuptools/json).
urls = ["https://files.pythonhosted.org/packages/ef/55/6dc6d6bb953bdfc52519a0059592c52b6e3b8ad51cf8256dffceb55b0610/setuptools-84.2.1-py3-none-any.whl"]
sha256 = "ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2"

