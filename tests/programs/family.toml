[[suite]]
name = "xsave"
kind = "deterministic"
harness = "programs"
input = "xsave"
reference = "x86"
matrix = { "engine.max_block" = [0, 1] }
batch = 64
smoke = false
x86_flag = "xsavec"

[[suite]]
name = "br66"
kind = "deterministic"
harness = "programs"
input = "br66"
reference = "qemu"
matrix = { "engine.max_block" = [0, 1] }
batch = 64
smoke = false
# QEMU 7.2 follows AMD for 66 on near branches; natemu, like Intel, ignores it: QEMU runs each program's
# twin with 3E for 66 (gen_br66.py), whose result is Intel's for the program.

[[suite]]
name = "i6b"
kind = "deterministic"
harness = "programs"
input = "i6b"
reference = "qemu"
matrix = { "engine.max_block" = [0, 1] }
batch = 64
smoke = false
# x87 against FEX's reduced precision until accurate 80-bit x87 (owner, November 18); PCMPxSTRx against QEMU.
reference_overrides = { "i6b-x87-*" = "fex" }

[[suite]]
name = "flow"
kind = "deterministic"
harness = "programs"
input = "s2d"
reference = "qemu"
batch = 64
smoke = false
