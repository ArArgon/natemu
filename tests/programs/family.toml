[[suite]]
name = "sha"
kind = "deterministic"
harness = "programs"
input = "sha"
reference = "x86"
matrix = { "engine.max_block" = [0, 1] }
batch = 64
smoke = false
x86_flag = "sha_ni"

[[suite]]
name = "adx"
kind = "deterministic"
harness = "programs"
input = "adx"
reference = "x86"
matrix = { "engine.max_block" = [0, 1] }
