# The devices family: stock Linux drivers against natemu's platform devices (pvpanic; SMBIOS, the 8042 and PS/2, and the
# device work of the multi-BAR PCI and virtio device interface plans as they land), through the `natemu` CLI. Each case
# (but the devices-console suites', at the end) is one run of tests/devices/run_platform.py: one VM from the initramfs
# `run_platform.py prepare` builds (the input
# root's devices-platform/platform, testkit/inputs.py platform_inputs()), judged from the guest's serial markers and the
# host's exit line. No QEMU answers: nothing is locked (tests.lock has no entries).
#
# Adding a case: its `case_<name>` function and dispatch line in run_platform.py's INIT, its CASES entry (kernel command
# line words and judge), a module it loads in MODULES, a negative control in self_check, and a [suite.cases] entry here.
#
# The devices-console suites run tests/devices/run_console.py instead (virtio-console, `[[console]]`; its docstring): one
# VM from the initramfs `run_console.py prepare` builds (the input root's devices-console/console, console_inputs()),
# judged from the serial markers, what the console's host end received and the exit line. Adding a console case: its
# case_<name> and dispatch in run_console.py's INIT, its judge in JUDGES, negative controls in self_check, an entry below.
#
# The devices-display suites run tests/devices/run_display.py (the display through the control API; its docstring): one VM
# from the initramfs `run_display.py prepare` builds with kms_pattern (the input root's devices-display/display,
# testkit/inputs.py display_inputs()), driven like the control cases. Adding a display case: its case_<name> and dispatch in INIT, its
# CASES entry (judge and driver), negative controls in self_check_judges, an entry below.
#
# The devices-control suites run tests/devices/run_control.py (the control socket, `[control] socket`; its docstring):
# one VM from the initramfs `run_control.py prepare` builds (the input root's devices-control/control,
# control_inputs()), driven through the socket by tests/lib/control_client.py and judged from the guest's evdev events
# on the serial console, the answers and the `stopped` notification, and the exit line. Adding a control case: its
# case_<name> and dispatch in run_control.py's INIT, its CASES entry (judge and driver), negative controls in
# self_check_judges, an entry below.
[family]
name = "devices"
covers = ["crates/host/src/pvpanic.rs", "crates/host/src/boot/smbios.rs", "crates/host/src/ps2.rs", "crates/host/src/ps2/**",
          "crates/host/src/lib.rs", "crates/host/src/boot.rs", "crates/abi/src/execution.rs",
          "crates/runtime/src/execution.rs", "crates/runtime/src/execution/segments.rs",
          "crates/runtime/src/execution/segments/span.rs", "crates/runtime/src/execution/interpret.rs",
          "crates/runtime/src/execution/mmio.rs", "crates/runtime/src/execution/ports.rs", "crates/runtime/src/cache.rs",
          "crates/host/src/vm.rs", "crates/host/src/memory.rs", "crates/host/src/execution/io.rs", "tests/io/run_io_matrix.py", "tests/io/run_io5.py", "tools/bench/boot.py",
          "tools/bench/run.py", "tests/bench/run_paper.py", "tests/bench/run_m1_perf.py", "crates/host/src/pm.rs", "crates/host/src/clock.rs",
          "crates/host/src/boot/acpi.rs", "crates/host/src/linux.rs", "crates/driver/src/drivers/linux.rs",
          "crates/driver/src/drivers/program.rs", "crates/cli/src/config.rs", "crates/cli/src/config/tests.rs",
          "crates/cli/src/main.rs", "docs/configuration.md", "tools/models/acpi_model.py", "tests/boot/run_l2.py",
          "tests/boot/run_l2_iasl.py", "testkit/harness/bench.py", "third_party/openvmm/**", "third_party/freebsd-bhyve/**",
          "crates/host/src/devices.rs", "crates/host/src/irq.rs", "crates/host/src/execution.rs", "crates/host/src/boot/**",
          "tests/devices/**", "tests/lib/**", "testkit/inputs.py",
          "crates/host/src/pci/**", "crates/host/src/virtio/pci.rs", "crates/host/src/virtio/console.rs",
          "crates/host/src/virtio/model.rs", "crates/host/src/virtio/mod.rs",
          "crates/host/src/control/**", "crates/host/src/display/**"]

[[suite]]
name = "devices"
kind = "judged"
harness = "runner"
params = { timeout = 600 }
needs = { cores = 1, perf = true }

# pvpanic: the stock pvpanic_mmio driver binds the ACPI device QEMU0001 and reads its capability (3: PANICKED and
# CRASH_LOADED); a panic (sysrq c, panic=0) must end the run with Stop::Power(4) (exit status 2) within 30 s.
[suite.cases."pvpanic-panic"]
argv = ["tests/devices/run_platform.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-platform/platform", "--out", "{out}", "--case", "pvpanic-panic"]
smoke = true

# SMBIOS (platform-devices plan Task 3), at 1 and 2 vCPUs: the kernel's DMI scan of F0000H-FFFFFH finds the SMBIOS 3.0
# entry point in the read-only legacy ROM page (dmesg `SMBIOS 3.0.0 present.` and `DMI: natemu natemu x86-64, BIOS natemu
# VERSION 11/23/2026`); /sys/class/dmi/id names natemu; /sys/firmware/dmi/entries holds one entry of each type natemu
# writes (0, 1, 3, 16, 17, 19, 32, 127) and one type 4 per vCPU. PS/2 (Task 4): i8042 finds the controller through ACPI
# (`PNP: PS/2 Controller [...] at 0x60,0x64 irq 1,12`), /proc/bus/input/devices lists `AT Translated Set 2 keyboard` on
# serio0 and, after `modprobe psmouse`, a PS/2 mouse on serio1, and dmesg has no `i8042: Can't read CTR` and no psmouse
# failure. The init's S5 ends the run with Power(1).
[suite.cases."platform[1]"]
argv = ["tests/devices/run_platform.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-platform/platform", "--out", "{out}", "--case", "platform", "--vcpus", "1"]
smoke = true

[suite.cases."platform[2]"]
argv = ["tests/devices/run_platform.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-platform/platform", "--out", "{out}", "--case", "platform", "--vcpus", "2"]
needs = { cores = 2, perf = true }

# The three devices off (Task 5), the machine every benchmark keeps: no SMBIOS (no `DMI:` line in dmesg, the kernel's
# `DMI not present or invalid.`, no /sys/firmware/dmi/entries), no serio port, no QEMU0001, PNP0303 or PNP0F13 among the
# ACPI devices; `reboot -f` with reboot=k (FEH to port 64H, the PM device's reset-only register) ends the run with
# Power(2).
[suite.cases."platform-off"]
argv = ["tests/devices/run_platform.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-platform/platform", "--out", "{out}", "--case", "platform-off",
        "--set", "machine.pvpanic=false", "--set", "machine.smbios=false", "--set", "machine.ps2=false"]

# The runner's self-check: the init's shell syntax, every case's dispatch, the judges' negative controls; no VM.
[[suite]]
name = "devices-selfcheck"
kind = "judged"
harness = "runner"
params = { timeout = 120 }

[suite.cases."platform-selfcheck"]
argv = ["tests/devices/run_platform.py", "self-check"]

# pci-multibar: the PCI test function (debug.pci_testdev: QEMU's pci-testdev, vendor 1B36H device 0005H) as functions 0
# and 1 of one slot, no driver bound: the kernel finds both and the root bridge's I/O window C000H-FFFFH, claims every
# BAR where natemu's launch placed it, and `enable` turns decoding on; BAR0 (memory, /dev/mem) and BAR1 (I/O, /dev/port)
# read the selected test's header, function 1's 64-bit BAR2 its offsets; S5 ends the run. At 1 and 2 vCPUs.
[[suite]]
name = "devices-pci"
kind = "judged"
harness = "runner"
params = { timeout = 600 }
needs = { cores = 2, perf = true }

[suite.cases."pci-multibar-1cpu"]
argv = ["tests/devices/run_platform.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-platform/platform", "--out", "{out}", "--case", "pci-multibar", "--vcpus", "1",
        "--set", "debug.pci_testdev=true"]

[suite.cases."pci-multibar-2cpu"]
argv = ["tests/devices/run_platform.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-platform/platform", "--out", "{out}", "--case", "pci-multibar", "--vcpus", "2",
        "--set", "debug.pci_testdev=true"]

# mapped-bar (mapped-device-memory plan Task 4): the mapped-memory test function (debug.mapped_testdev: vendor 1B36H
# device 0005H subsystem 0100H), no driver bound. BAR0 is 2 MiB of host-backed device memory the guest reads and writes
# natively: the init writes a pattern into it through an mmap of /dev/mem and reads it back, compares BAR2's SUM (the
# host's sum, through a second mapping of the object) and FILL (the host's pattern), then moves BAR0 through the sysfs
# config file (decoding off, a new base, decoding on) while a probe on the last CPU holds a mapping of the old base: it
# must read all-ones afterwards (the remap shootdown), the data is at the new base and the old one reads all-ones. The
# host's `natemu: mapped` line: the table at the end, publishes, and per vCPU installs and remaps (at least one per
# publish). S5 ends the run. At 1 and 2 vCPUs.
[suite.cases."mapped-bar-1cpu"]
argv = ["tests/devices/run_platform.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-platform/platform", "--out", "{out}", "--case", "mapped-bar", "--vcpus", "1",
        "--set", "debug.mapped_testdev=true"]

[suite.cases."mapped-bar-2cpu"]
argv = ["tests/devices/run_platform.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-platform/platform", "--out", "{out}", "--case", "mapped-bar", "--vcpus", "2",
        "--set", "debug.mapped_testdev=true"]

# display-probe (Bochs display plan Task 2): `[display] device = "bochs"`, the display (QEMU's bochs-display,
# 1234:1111) at slot 1 with its EDID's preferred mode 1024 x 768. The stock bochs DRM driver (a module, with
# drm_kms_helper and the rest of DRM it depends on) binds it with its BARs where the launch placed them (BAR0 32 MiB at
# E2000000H, BAR2 at E4000000H); /sys/class/drm/card0 and /dev/dri/card0 exist; card0-Virtual-1/modes lists 1024x768
# first and 800x600 and 640x480; dmesg names bochs-drm with `Found bochs VGA, ID 0xb0c5.` and `Found EDID data blob.`;
# the host's `natemu: mapped` line shows the framebuffer as one region decoding at BAR0. S5 ends the run.
[suite.cases."display-probe"]
argv = ["tests/devices/run_platform.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-platform/platform", "--out", "{out}", "--case", "display-probe", "--vcpus", "1",
        "--set", "display.device=bochs"]

# The display through the control API (tests/devices/run_display.py's docstring: kms_pattern's picture, read back by
# `framebuffer` and `snapshot`), each at 1 vCPU. Input: display.cpio with kms_pattern, built in the amd64 container
# (testkit/inputs.py display_inputs()), under the input root as devices-display/display.
[[suite]]
name = "devices-display"
kind = "judged"
harness = "runner"
params = { timeout = 600 }
needs = { cores = 1, perf = true }

# kms_pattern's 640 x 480 framebuffer (pitch 3200, offsets[0] 16 rows) read through the mapped descriptor and a
# snapshot ({out}/display.png): every visible pixel is the pattern; display_changed announced the mode; quit.
[suite.cases."display"]
argv = ["tests/devices/run_display.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-display/display", "--out", "{out}", "--case", "display", "--vcpus", "1", "--set", "display.device=bochs"]
smoke = true

# fbcon's tty1 with a few lines of text at 1024 x 768: the snapshot ({out}/boot-console.png) shows text; quit.
[suite.cases."display-boot-console"]
argv = ["tests/devices/run_display.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-display/display", "--out", "{out}", "--case", "display-boot-console", "--vcpus", "1", "--set", "display.device=bochs"]

# No [display]: snapshot and framebuffer are -32001, query_status has no display, the guest has no 1234:1111; quit.
[suite.cases."display-off"]
argv = ["tests/devices/run_display.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-display/display", "--out", "{out}", "--case", "display-off", "--vcpus", "1"]

# run_display.py's self-check: the init's shell syntax, kms_pattern.c's geometry and pattern, the pixel comparisons'
# and the judges' negative controls; no VM (and no display input).
[[suite]]
name = "devices-display-selfcheck"
kind = "judged"
harness = "runner"
params = { timeout = 120 }

[suite.cases."display-selfcheck"]
argv = ["tests/devices/run_display.py", "self-check"]

# virtio-console (tests/devices/run_console.py): the cases.
[[suite]]
name = "devices-console"
kind = "judged"
harness = "runner"
params = { timeout = 600 }
needs = { cores = 1, perf = true }

# virtio-console on a host output (run_console.py's docstring): the guest writes 256 KiB of pattern to /dev/hvc0 and
# powers off. The output is a pipe the runner reads only after the power-off began, so the device's power-off drain
# must deliver the tail; the runner checks the bytes are exactly the pattern (no CR added) and `natemu: Power(1)`.
# `-file` writes 1 MiB to a regular file instead (created by natemu).
[suite.cases."console-file-mmio-1"]
argv = ["tests/devices/run_console.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-console/console", "--out", "{out}", "--case", "console-file", "--transport", "mmio", "--cpus", "1"]

[suite.cases."console-file-mmio-2"]
argv = ["tests/devices/run_console.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-console/console", "--out", "{out}", "--case", "console-file", "--transport", "mmio", "--cpus", "2"]
needs = { cores = 2, perf = true }

[suite.cases."console-file-pci-1"]
argv = ["tests/devices/run_console.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-console/console", "--out", "{out}", "--case", "console-file", "--transport", "pci", "--cpus", "1"]
smoke = true

[suite.cases."console-file-pci-2"]
argv = ["tests/devices/run_console.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-console/console", "--out", "{out}", "--case", "console-file", "--transport", "pci", "--cpus", "2"]
needs = { cores = 2, perf = true }

[suite.cases."console-file-pci-1-file"]
argv = ["tests/devices/run_console.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-console/console", "--out", "{out}", "--case", "console-file", "--transport", "pci", "--cpus", "1", "--sink", "file"]

# virtio-console on a Unix socket: the runner connects after the guest's ready marker, sends `ping NONCE` and 4 MiB of
# pattern, which the guest leaves unread for 3 s (the device must hold input back), then reads and answers with the
# nonce reversed and the pattern's SHA-256; the runner checks the reply, that the socket is gone after natemu exits,
# and `natemu: Power(1)`.
[suite.cases."console-socket-mmio-1"]
argv = ["tests/devices/run_console.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-console/console", "--out", "{out}", "--case", "console-socket", "--transport", "mmio", "--cpus", "1"]

[suite.cases."console-socket-mmio-2"]
argv = ["tests/devices/run_console.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-console/console", "--out", "{out}", "--case", "console-socket", "--transport", "mmio", "--cpus", "2"]
needs = { cores = 2, perf = true }

[suite.cases."console-socket-pci-1"]
argv = ["tests/devices/run_console.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-console/console", "--out", "{out}", "--case", "console-socket", "--transport", "pci", "--cpus", "1"]

[suite.cases."console-socket-pci-2"]
argv = ["tests/devices/run_console.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-console/console", "--out", "{out}", "--case", "console-socket", "--transport", "pci", "--cpus", "2"]
needs = { cores = 2, perf = true }

# run_console.py's self-check: the init's shell syntax and its reverse() (run by the host's sh), the patterns, the
# judges' negative controls; no VM.
[[suite]]
name = "devices-console-selfcheck"
kind = "judged"
harness = "runner"
params = { timeout = 120 }

[suite.cases."console-selfcheck"]
argv = ["tests/devices/run_console.py", "self-check"]

# The control socket (tests/devices/run_control.py's docstring), each at 1 vCPU, control-keyboard also at 2.
[[suite]]
name = "devices-control"
kind = "judged"
harness = "runner"
params = { timeout = 600 }
needs = { cores = 1, perf = true }

# Every KeyCode pressed and released, KEYS_PER_SEND keys per send_input, each part reported by the guest before the
# next: the keyboard's EV_KEY events are the Linux KEY_* of the runner's table, in order; then a second client holds
# ShiftLeft and disconnects: the release arrives; then the sentinel KeyZ tap ends the stream. Ends with quit.
[suite.cases."control-keyboard"]
argv = ["tests/devices/run_control.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-control/control", "--out", "{out}", "--case", "control-keyboard", "--vcpus", "1"]
smoke = true

[suite.cases."control-keyboard[2]"]
argv = ["tests/devices/run_control.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-control/control", "--out", "{out}", "--case", "control-keyboard", "--vcpus", "2"]
needs = { cores = 2, perf = true }

# dx 1000 sums to REL_X 1000, dy 40 is REL_Y +40, scroll dy 3 is REL_WHEEL -3 and -3 is +3, each button down and up;
# the sentinel left click ends the stream.
[suite.cases."control-mouse"]
argv = ["tests/devices/run_control.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-control/control", "--out", "{out}", "--case", "control-mouse", "--vcpus", "1"]

# power_button: KEY_POWER down and up on the fixed "Power Button" (LNXPWRBN), then the init powers off: stopped
# power_off, natemu: Power(1), exit status 0.
[suite.cases."control-power-button"]
argv = ["tests/devices/run_control.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-control/control", "--out", "{out}", "--case", "control-power-button", "--vcpus", "1"]
smoke = true

# With machine.ps2=false: query_status while running (no ps2), send_input is -32001 naming ps2, quit ends the run with
# stopped cancelled and exit status 2.
[suite.cases."control-status"]
argv = ["tests/devices/run_control.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-control/control", "--out", "{out}", "--case", "control-status", "--vcpus", "1",
        "--set", "machine.ps2=false"]

# run_control.py's self-check: the init's shell syntax and device lookup, KEY_CODES against protocol.rs, the event
# format, the modules, the judges' negative controls; no VM.
[[suite]]
name = "devices-control-selfcheck"
kind = "judged"
harness = "runner"
params = { timeout = 120 }

[suite.cases."control-selfcheck"]
argv = ["tests/devices/run_control.py", "self-check"]
