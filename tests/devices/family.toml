# The devices family: stock Linux drivers against natemu's platform devices (pvpanic; SMBIOS, the 8042 and PS/2, and the
# device work of the multi-BAR PCI and virtio device interface plans as they land), through the `natemu` CLI. Each case
# is one run of tests/devices/run_platform.py: one VM from the initramfs `run_platform.py prepare` builds (the input
# root's devices-platform/platform, testkit/inputs.py platform_inputs()), judged from the guest's serial markers and the
# host's exit line. No QEMU answers: nothing is locked (tests.lock has no entries).
#
# Adding a case: its `case_<name>` function and dispatch line in run_platform.py's INIT, its CASES entry (kernel command
# line words and judge), a module it loads in MODULES, a negative control in self_check, and a [suite.cases] entry here.
[family]
name = "devices"
covers = ["crates/host/src/pvpanic.rs", "crates/host/src/boot/smbios.rs", "crates/host/src/ps2.rs", "crates/host/src/ps2/**",
          "crates/host/src/lib.rs", "crates/host/src/boot.rs", "crates/abi/src/execution.rs",
          "crates/runtime/src/execution/mmio.rs", "crates/host/src/pm.rs", "crates/host/src/clock.rs",
          "crates/host/src/boot/acpi.rs", "crates/host/src/linux.rs", "crates/driver/src/drivers/linux.rs",
          "crates/driver/src/drivers/program.rs", "crates/cli/src/config.rs", "crates/cli/src/config/tests.rs",
          "crates/cli/src/main.rs", "docs/configuration.md", "tools/models/acpi_model.py", "tests/boot/run_l2.py",
          "tests/boot/run_l2_iasl.py", "testkit/harness/bench.py", "third_party/openvmm/**", "third_party/freebsd-bhyve/**",
          "crates/host/src/devices.rs", "crates/host/src/irq.rs", "crates/host/src/execution.rs", "crates/host/src/boot/**",
          "tests/devices/**", "tests/lib/**", "testkit/inputs.py"]

[[suite]]
name = "devices"
kind = "judged"
harness = "runner"
params = { timeout = 600 }
needs = { cores = 1, perf = true }

# pvpanic: the stock pvpanic_mmio driver binds the ACPI device QEMU0001 and reads its capability (3: PANICKED and
# CRASH_LOADED); a panic (sysrq c, panic=0) must end the run with Stop::Power(4) (exit status 2) within 30 s.
[suite.cases."pvpanic-panic"]
argv = ["tests/devices/run_platform.py", "run", "--natemu", "{natemu_stub}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}",
        "--inputs", "{raw}/devices-platform/platform", "--out", "{out}", "--case", "pvpanic-panic"]
smoke = true

# The runner's self-check: the init's shell syntax, every case's dispatch, the judges' negative controls; no VM.
[[suite]]
name = "devices-selfcheck"
kind = "judged"
harness = "runner"
params = { timeout = 120 }

[suite.cases."platform-selfcheck"]
argv = ["tests/devices/run_platform.py", "self-check"]
