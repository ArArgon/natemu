# The faults family's runner cases: each runs one script in this folder (or tests/lib) unchanged, with its inputs from
# the framework's input root and its QEMU answers locked in tests.lock (docs/testing.md, tests/README.md).
[family]
name = "faults"
covers = ["crates/**", "third_party/FEX", "tools/**", "tests/faults/**", "tests/lib/**"]

[[suite]]
name = "faults"
kind = "judged"
harness = "runner"
params = { timeout = 3600 }

[suite.cases."faults@1"]
argv = ["env", "NATEMU_TEST_GUEST_STATE_ALIAS=0xffff407abcde0000", "python3", "tests/faults/run_slice1_faults.py", "--shard", "1/5", "--fexc", "{fexc}", "--out", "{out}"]
smoke = true

[suite.cases."faults@2"]
argv = ["env", "NATEMU_TEST_GUEST_STATE_ALIAS=0xffff407abcde0000", "python3", "tests/faults/run_slice1_faults.py", "--shard", "2/5", "--fexc", "{fexc}", "--out", "{out}"]

[suite.cases."faults@3"]
argv = ["env", "NATEMU_TEST_GUEST_STATE_ALIAS=0xffff407abcde0000", "python3", "tests/faults/run_slice1_faults.py", "--shard", "3/5", "--fexc", "{fexc}", "--out", "{out}"]

[suite.cases."faults@4"]
argv = ["env", "NATEMU_TEST_GUEST_STATE_ALIAS=0xffff407abcde0000", "python3", "tests/faults/run_slice1_faults.py", "--shard", "4/5", "--fexc", "{fexc}", "--out", "{out}"]

