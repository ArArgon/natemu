# The boot family's runner cases: each runs one script in this folder (or tests/lib) unchanged, with its inputs from
# the framework's input root and its QEMU answers locked in tests.lock (docs/testing.md, tests/README.md).
[family]
name = "boot"
covers = ["crates/**", "third_party/FEX", "tools/**", "tests/boot/**", "tests/lib/**"]

[[suite]]
name = "boot"
kind = "judged"
harness = "runner"
params = { timeout = 3600 }

[suite.cases."l1"]
argv = ["tests/boot/run_l1.py", "--out", "{out}"]
needs = { exclusive = true, why = "builds natemu in the worktree" }
smoke = true
builds = true

[suite.cases."l2"]
argv = ["tests/boot/run_l2.py", "--out", "{out}"]
needs = { exclusive = true, why = "builds natemu in the worktree" }
smoke = true
builds = true

[suite.cases."l2-iasl"]
argv = ["tests/boot/run_l2_iasl.py", "--out", "{out}"]
needs = { exclusive = true, why = "builds natemu in the worktree" }
smoke = true
builds = true

# M2 task 3b: a small static 32-bit program under the Debian kernel (tests/boot/i386_static.asm).
[suite.cases."boot-i386"]
argv = ["tests/boot/run_boot_smoke.py", "--only", "i386", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "builds natemu in the worktree" }
builds = true

[suite.cases."boot-smoke"]
argv = ["tests/boot/run_boot_smoke.py", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "Ctrl-C must end the stub within 5 s; boots under a 120 s timeout" }
smoke = true
builds = true
rerun = true

# The M2 exit test's firmware (tests/boot/exit_fw.asm) and its AP part as a 64-bit program (exit_prog.asm), both built
# here with nasm, on the references at 1, 2 and 4 CPUs (tests/boot/run_exit_fw.py; docs/restructure/m2-exit-firmware.md):
# -qemu the pinned QEMU 11.1.2 under TCG, -kvm real hardware (the x86 reference machine under KVM). Their answers are
# locked in tests.lock: a run checks that the lock's answer for the image as built now is the expected report, without
# QEMU or the x86 machine; seeding (TESTKIT_SEED_ANSWERS=1, and NATEMU_X86_HOST=user@host for -kvm) runs them. The
# natemu cases come with the slices that make them pass (the CPU start-up slice, the firmware boot mode).
[[suite]]
name = "exit-fw"
kind = "judged"
harness = "runner"
params = { timeout = 900 }

[suite.cases."exit-fw-qemu"]
argv = ["tests/boot/run_exit_fw.py", "--variant", "firmware", "--backend", "qemu", "--out", "{out}"]
needs = { cores = 2 }
smoke = true

[suite.cases."exit-fw-kvm"]
argv = ["tests/boot/run_exit_fw.py", "--variant", "firmware", "--backend", "kvm", "--out", "{out}"]
needs = { cores = 1 }
timeout = 2400

[suite.cases."exit-ap-qemu"]
argv = ["tests/boot/run_exit_fw.py", "--variant", "program", "--backend", "qemu", "--out", "{out}"]
needs = { cores = 2 }
smoke = true

[suite.cases."exit-ap-kvm"]
argv = ["tests/boot/run_exit_fw.py", "--variant", "program", "--backend", "kvm", "--out", "{out}"]
needs = { cores = 1 }
timeout = 2400

# The program variant under natemu (CPU start-up slice): at 1 CPU the pass; at 2 and 4, while the boot-time interpreter is
# the stop at its entry, the pass up to the SIPI landing (tests/boot/run_exit_fw.py --backend natemu).
[suite.cases."exit-ap-natemu"]
argv = ["tests/boot/run_exit_fw.py", "--variant", "program", "--backend", "natemu", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4, perf = true }
smoke = true

# The real-code suites the boot-time interpreter is judged by (docs/restructure/real-code-suites.md), their inputs built
# in the amd64 builder container from pinned sources (tests/boot/built_inputs.py, tools/boot/*), on the references:
# -qemu the pinned QEMU 11.1.2 under TCG, -kvm the x86 reference machine under KVM. A run checks that the lock's answer
# for the input's upstream (its sources, recipe and builder image) is the pass, without QEMU or the x86 machine; seeding
# (TESTKIT_SEED_ANSWERS=1, and NATEMU_X86_HOST=user@host for -kvm) runs them. The natemu cases come with the slices that
# make them pass (the CPU start-up slice with the Multiboot loader; the firmware boot mode).
#
# kvm-unit-tests a2891d95: smptest and dummy (the Multiboot entry, the climb to 64-bit mode, INIT and SIPI to every
# other CPU through the 16-bit trampoline), each at 1 to 4 CPUs, judged by the test's own verdict.
[[suite]]
name = "kvm-unit-tests"
kind = "judged"
harness = "built_inputs.py:Runner"
inputs = ["kvm-unit-tests"]
params = { timeout = 900 }

[suite.cases."kut-qemu"]
argv = ["tests/boot/run_kut.py", "--backend", "qemu", "--out", "{out}"]
needs = { cores = 2 }
smoke = true

[suite.cases."kut-kvm"]
argv = ["tests/boot/run_kut.py", "--backend", "kvm", "--out", "{out}"]
needs = { cores = 1 }
timeout = 2400

# OVMF (edk2-stable202608, OvmfPkgX64, DEBUG, no SMM, no Secure Boot): the reset vector to SEC's entry in 64-bit mode,
# from the reset state (16-bit) and from FFFFFFF0H with PE already set (Main32), the registers at SEC's first instruction.
[[suite]]
name = "ovmf"
kind = "judged"
harness = "built_inputs.py:Runner"
inputs = ["ovmf"]
params = { timeout = 900 }

[suite.cases."ovmf-qemu"]
argv = ["tests/boot/run_ovmf.py", "--backend", "qemu", "--out", "{out}"]
needs = { cores = 1 }

[suite.cases."ovmf-kvm"]
argv = ["tests/boot/run_ovmf.py", "--backend", "kvm", "--out", "{out}"]
needs = { cores = 1 }
timeout = 2400
