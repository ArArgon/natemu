# The boot family's runner cases: each runs one script in this folder (or tests/lib) unchanged, with its inputs from
# the framework's input root and its QEMU answers locked in tests.lock (docs/testing.md, tests/README.md).
[family]
name = "boot"
covers = ["crates/**", "third_party/FEX", "tools/**", "tests/boot/**", "tests/lib/**"]

[[suite]]
name = "boot"
kind = "judged"
harness = "runner"
params = { timeout = 3600 }

[suite.cases."l1"]
argv = ["tests/boot/run_l1.py", "--out", "{out}"]
needs = { exclusive = true, why = "builds natemu in the worktree" }
smoke = true
builds = true

[suite.cases."l2"]
argv = ["tests/boot/run_l2.py", "--out", "{out}"]
needs = { exclusive = true, why = "builds natemu in the worktree" }
smoke = true
builds = true

[suite.cases."l2-iasl"]
argv = ["tests/boot/run_l2_iasl.py", "--out", "{out}"]
needs = { exclusive = true, why = "builds natemu in the worktree" }
smoke = true
builds = true

# M2 task 3b: a small static 32-bit program under the Debian kernel (tests/boot/i386_static.asm).
[suite.cases."boot-i386"]
argv = ["tests/boot/run_boot_smoke.py", "--only", "i386", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "builds natemu in the worktree" }
builds = true

[suite.cases."boot-smoke"]
argv = ["tests/boot/run_boot_smoke.py", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "Ctrl-C must end the stub within 5 s; boots under a 120 s timeout" }
smoke = true
builds = true
rerun = true

# M2 Part 2's CPU start-up slice on Debian's kernel (run_boot_smoke.py `startup`): at 2 and 4 vCPUs, with the ACPI
# wakeup mailbox and without it (the APs started by INIT and SIPI through Linux's real-mode trampoline, which the
# boot-time interpreter runs): every CPU online, each AP offline and online again where Linux allows it, the warm-reset
# path, and the shutdown.
[suite.cases."boot-startup"]
argv = ["tests/boot/run_boot_smoke.py", "--only", "startup", "--host", "{natemu_host}", "--runtime", "{natemu_runtime}",
        "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4, perf = true }

# The M2 exit test's firmware (tests/boot/exit_fw.asm) and its AP part as a 64-bit program (exit_prog.asm), both built
# here with nasm, on the references at 1, 2, 4 and 8 CPUs (tests/boot/run_exit_fw.py;
# docs/restructure/m2-exit-firmware.md): -qemu the pinned QEMU 11.1.2 under TCG, -kvm real hardware (the x86 reference
# machine under KVM). Their answers are locked in tests.lock: a run checks that the lock's answer for the image as built
# now is the expected report, without QEMU or the x86 machine; seeding (TESTKIT_SEED_ANSWERS=1, and
# NATEMU_X86_HOST=user@host for -kvm) runs them. The natemu cases: the program variant's (the CPU start-up slice) and the
# firmware's (the firmware boot mode).
[[suite]]
name = "exit-fw"
kind = "judged"
harness = "runner"
params = { timeout = 900 }

[suite.cases."exit-fw-qemu"]
argv = ["tests/boot/run_exit_fw.py", "--variant", "firmware", "--backend", "qemu", "--out", "{out}"]
needs = { cores = 2 }
smoke = true

[suite.cases."exit-fw-kvm"]
argv = ["tests/boot/run_exit_fw.py", "--variant", "firmware", "--backend", "kvm", "--out", "{out}"]
needs = { cores = 1 }
timeout = 2400

[suite.cases."exit-ap-qemu"]
argv = ["tests/boot/run_exit_fw.py", "--variant", "program", "--backend", "qemu", "--out", "{out}"]
needs = { cores = 2 }
smoke = true

[suite.cases."exit-ap-kvm"]
argv = ["tests/boot/run_exit_fw.py", "--variant", "program", "--backend", "kvm", "--out", "{out}"]
needs = { cores = 1 }
timeout = 2400

# The program variant under natemu (tests/boot/run_exit_fw.py --backend natemu): at 1, 2, 4 and 8 CPUs the APs climb
# from their SIPI in the boot-time interpreter (16 -> 32 -> compatibility mode) to 64-bit code and are counted from there.
[suite.cases."exit-ap-natemu"]
argv = ["tests/boot/run_exit_fw.py", "--variant", "program", "--backend", "natemu", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4, perf = true }
smoke = true

# The firmware under natemu's firmware boot mode (docs/restructure/firmware-mode.md), at 1, 2, 4 and 8 CPUs, the BSP
# from the reset vector: COM1's report and the power-off, decode exits and shootdowns bounded per vCPU
# (tests/boot/run_exit_fw.py --variant firmware --backend natemu).
[suite.cases."exit-fw-natemu"]
argv = ["tests/boot/run_exit_fw.py", "--variant", "firmware", "--backend", "natemu", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4, perf = true }
smoke = true

# The real-code suites the boot-time interpreter is judged by (docs/restructure/real-code-suites.md), their inputs built
# in the amd64 builder container from pinned sources (tests/boot/built_inputs.py, tools/boot/*), on the references:
# -qemu the pinned QEMU 11.1.2 under TCG, -kvm the x86 reference machine under KVM. A run checks that the lock's answer
# for the input's upstream (its sources, recipe and builder image) is the pass, without QEMU or the x86 machine; seeding
# (TESTKIT_SEED_ANSWERS=1, and NATEMU_X86_HOST=user@host for -kvm) runs them. The natemu cases, kut-natemu (the Multiboot
# loader and CPU start-up) and ovmf-natemu (the firmware boot mode), run them in natemu.
#
# kvm-unit-tests a2891d95: smptest and dummy (the Multiboot entry, the climb to 64-bit mode, INIT and SIPI to every
# other CPU through the 16-bit trampoline), each at 1 to 4 CPUs, judged by the test's own verdict.
[[suite]]
name = "kvm-unit-tests"
kind = "judged"
harness = "built_inputs.py:Runner"
inputs = ["kvm-unit-tests"]
params = { timeout = 900 }

[suite.cases."kut-qemu"]
argv = ["tests/boot/run_kut.py", "--backend", "qemu", "--out", "{out}"]
needs = { cores = 2 }
smoke = true

[suite.cases."kut-kvm"]
argv = ["tests/boot/run_kut.py", "--backend", "kvm", "--out", "{out}"]
needs = { cores = 1 }
timeout = 2400

# natemu: each test at 1 to 4 vCPUs through the Multiboot loader and --debug-exit (the boot-time interpreter runs the
# BSP's 32-bit entry and each AP's trampoline), judged by run_kut.judge and against the locked KVM answer's lines.
[suite.cases."kut-natemu"]
argv = ["tests/boot/run_kut.py", "--backend", "natemu", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4, perf = true }

# OVMF (edk2-stable202608, OvmfPkgX64, DEBUG, no SMM, no Secure Boot): the reset vector to SEC's entry in 64-bit mode,
# from the reset state (16-bit) and from FFFFFFF0H with PE already set (Main32), the registers at SEC's first instruction.
[[suite]]
name = "ovmf"
kind = "judged"
harness = "built_inputs.py:Runner"
inputs = ["ovmf"]
params = { timeout = 900 }

[suite.cases."ovmf-qemu"]
argv = ["tests/boot/run_ovmf.py", "--backend", "qemu", "--out", "{out}"]
needs = { cores = 1 }

[suite.cases."ovmf-kvm"]
argv = ["tests/boot/run_ovmf.py", "--backend", "kvm", "--out", "{out}"]
needs = { cores = 1 }
timeout = 2400

# OVMF in natemu's firmware boot mode from both entries to SEC's entry, judged as the references and compared with KVM's
# locked registers (tests/boot/run_ovmf.py --backend natemu).
[suite.cases."ovmf-natemu"]
argv = ["tests/boot/run_ovmf.py", "--backend", "natemu", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 1, perf = true }
