# Unit tests (spec R3.8, R6.3a): every tier runs all of them. Rust through cargo-nextest; the Python tests (the test_*.py
# files under tools/, tests/lib and the family folders), one file per case, each test reported on its own.
[family]
name = "unit"

# The Rust tests, with the compiler attached (FEXC): a test that needs it returns early without it, so one run with it
# checks everything. Split three ways so the disk-heavy qcow tests and the one long FP sweep (about 160 s) do not hold
# eight cores: rust-qcow and rust-fp name their tests; rust runs every test their filters leave (testkit.harness.units).
# Performance cores only, as `cores = "all"` placed them before: on efficiency cores (background QoS) the channel tests'
# wake-latency bounds (under 10 ms) and the qcow tests' disk I/O would be throttled.
[[suite]]
name = "rust"
kind = "units"
harness = "units"
params = { tool = "nextest", fexc = true, rest_of = ["rust-qcow", "rust-fp", "rust-fs-sweep", "rust-admission"] }
needs = { cores = 4, perf = true }

[[suite]]
name = "rust-qcow"
kind = "units"
harness = "units"
params = { tool = "nextest", fexc = true, filter = "package(natemu-qcow) | test(/^disk::qcow::/)" }
needs = { cores = 2, perf = true }

[[suite]]
name = "rust-fp"
kind = "units"
harness = "units"
params = { tool = "nextest", fexc = true, filter = "test(/afp/)" }
needs = { cores = 1, perf = true }

[[suite]]
name = "rust-fs-sweep"
# M2 checkpoint C: admission's sweep of every 32-bit memory form through a limited FS or GS (about 170,000 compiles on
# eight threads, four to five minutes): on its own, so the other Rust tests do not wait for it.
kind = "units"
harness = "units"
params = { tool = "nextest", fexc = true, filter = "test(/every_limited_fs_form/)" }
needs = { cores = 4, perf = true }

[[suite]]
name = "rust-admission"
# Admission's results on the recorded corpus (crates/host/src/admission/corpus.rs, tests/admission-corpus): on its own, so a
# change to admission can run it alone (`-k rust-admission`) and a reseed (NATEMU_ADMISSION_CORPUS_RESEED=1) runs nothing else.
kind = "units"
harness = "units"
params = { tool = "nextest", filter = "test(/^admission::corpus::/)" }
needs = { cores = 1, perf = true }

[[suite]]
name = "rust-afp"
# Rust tests that compare with the M4's FEAT_AFP hardware: #[ignore]d everywhere (reported as skipped by the rust suites),
# run here only on a host that has AFP (they cannot be emulated by hiding a feature).
kind = "units"
harness = "units"
params = { tool = "nextest", args = ["--run-ignored", "only", "-E", "test(/::native::.*m4s/)"] }
matrix = { "host.afp" = [true] }
needs = { cores = "all" }

[[suite]]
name = "rust-timed"
# Rust tests with a wall-clock bound: #[ignore]d in the rust suites (where nextest runs disk-heavy tests beside them; the
# 64 GiB write-zeroes took 13 s against its 5 s bound there on the M4, 0.04 s alone), run here alone.
kind = "units"
harness = "units"
params = { tool = "nextest", args = ["--run-ignored", "only", "-E", "test(/write_zeroes_of_64_gib_on_a_fresh_overlay/)"] }
needs = { exclusive = true, why = "a wall-clock bound on disk work (qcow write-zeroes of 64 GiB in under 5 s)" }

[[suite]]
name = "python"
kind = "units"
harness = "units"
params = { tool = "pytest", exclude = ["tools/test_vm_lock.py", "tools/test_check_setup.py"], fexc = true }
batch = 8

[[suite]]
name = "python-timed"
# test_vm_lock sleeps and test_check_setup has a 50 ms deadline: performance cores only.
kind = "units"
harness = "units"
params = { tool = "pytest", include = ["tools/test_vm_lock.py", "tools/test_check_setup.py"], fexc = true }
needs = { perf = true }
