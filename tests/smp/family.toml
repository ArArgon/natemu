# The smp family's runner cases: each runs one script in this folder (or tests/lib) unchanged, with its inputs from
# the framework's input root and its QEMU answers locked in tests.lock (docs/testing.md, tests/README.md).
[family]
name = "smp"
covers = ["crates/**", "third_party/FEX", "tools/**", "tests/smp/**", "tests/faults/**", "tests/lib/**"]

[[suite]]
name = "smp"
kind = "judged"
harness = "runner"
params = { timeout = 3600 }

[suite.cases."vector-ac"]
argv = ["tests/smp/run_vector_ac.py", "--fexc", "{fexc}", "--out", "{out}"]
smoke = true

[suite.cases."vector-split-smp"]
argv = ["tests/smp/run_vector_split_smp.py", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "three vCPUs exercise split-lock ownership and vector completion concurrently" }
smoke = true
rerun = true

[suite.cases."corpora-c2"]
argv = ["tests/smp/run_slice3_vm.py", "corpora", "--cpus", "2", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }
smoke = true

[suite.cases."corpora-c3"]
argv = ["tests/smp/run_slice3_vm.py", "corpora", "--cpus", "3", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }

[suite.cases."corpora-c4"]
argv = ["tests/smp/run_slice3_vm.py", "corpora", "--cpus", "4", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }

[suite.cases."smp"]
argv = ["tests/smp/run_slice3_vm.py", "smp", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 8, perf = true, mixed = true }
smoke = true

[suite.cases."limits"]
argv = ["tests/smp/run_slice3_vm.py", "limits", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

[suite.cases."kicks"]
argv = ["tests/smp/run_slice3_vm.py", "kicks", "--kicks", "1000", "--cpus", "1", "2", "4", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "host kicker threads against hot loops (boot-handoff §5: timing-sensitive)" }
smoke = true
rerun = true

[suite.cases."system"]
argv = ["tests/smp/run_slice3_vm.py", "system", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

[suite.cases."coherence"]
argv = ["tests/smp/run_slice3_vm.py", "coherence", "--reps", "1", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }
smoke = true

[suite.cases."sharedpt"]
argv = ["tests/smp/run_slice3_vm.py", "sharedpt", "--reps", "1", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }
smoke = true

[suite.cases."litmus"]
argv = ["tests/smp/run_slice3_vm.py", "litmus", "--k", "5000", "--runs", "1", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 8, perf = true, mixed = true }
smoke = true

[suite.cases."contain"]
argv = ["tests/smp/run_slice3_vm.py", "contain", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "wall-clock bounds: each failing run ends within 10 s (watchdog runs: + 5 s), a killed server within 2 s" }
smoke = true
rerun = true

[suite.cases."privilege"]
argv = ["env", "NATEMU_TEST_GUEST_STATE_ALIAS=0xffff407abcde0000", "python3", "tests/smp/run_slice3_vm.py", "privilege", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

[suite.cases."delivery"]
argv = ["tests/smp/run_slice3_vm.py", "delivery", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

[suite.cases."events"]
argv = ["env", "NATEMU_TEST_GUEST_STATE_ALIAS=0xffff407abcde0000", "python3", "tests/smp/run_slice3_vm.py", "events", "--kicks", "2000", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

# The capacity runners (docs/restructure/capacity.md).
[[suite]]
name = "capacity-selfcheck"
kind = "judged"
harness = "runner"
params = { timeout = 300 }

[suite.cases."capacity-apic-selfcheck"]
argv = ["tests/smp/run_capacity_apic.py", "--self-check"]
smoke = true

# Campaign tier, never in the gate (`natemu-test run --tier campaign tests/smp/family.toml -k capacity`): the limits of
# docs/restructure/capacity.md, 64 vCPUs and 34 GiB of guest RAM (touched sparsely). About 2 min 20 s and 25 s on the
# M2 Max.
[[suite]]
name = "capacity"
tier = "campaign"
kind = "judged"
harness = "runner"
needs = { exclusive = true, why = "64 vCPUs: every core of the machine is busy for the whole case" }
params = { timeout = 5400 }

[suite.cases."capacity"]
argv = ["tests/smp/run_capacity.py", "--host", "{natemu_host}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]

[suite.cases."capacity-apic"]
argv = ["tests/smp/run_capacity_apic.py", "--host", "{natemu_host}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
results = "capacity-apic.json"

# Native observations of compatibility segments. Two seed runs use NATEMU_X86_HOST on an AMD KVM host.
[[suite]]
name = "compat-kvm"
tier = "campaign"
kind = "judged"
harness = "runner"
params = { timeout = 2100 }

[suite.cases."amd-reference"]
argv = ["tests/smp/run_compat_kvm.py", "--out", "{out}"]
