# Generated by `python3 -m testkit.migrate` from tools/run_suite.py (spec R13): the smp runners, each case one
# unchanged runner invocation with inputs from the input root and QEMU answers locked. Edit run_suite.py and regenerate.
[family]
name = "smp"
covers = ["crates/**", "third_party/FEX", "tools/**"]

[[suite]]
name = "smp"
kind = "judged"
harness = "runner"
params = { timeout = 3600 }

[suite.cases."vector-ac"]
argv = ["tools/run_vector_ac.py", "--fexc", "{fexc}", "--out", "{out}"]
smoke = true

[suite.cases."vector-split-smp"]
argv = ["tools/run_vector_split_smp.py", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "three vCPUs exercise split-lock ownership and vector completion concurrently" }
smoke = true
rerun = true

[suite.cases."corpora-c2"]
argv = ["tools/run_slice3_vm.py", "corpora", "--cpus", "2", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }
smoke = true

[suite.cases."corpora-c3"]
argv = ["tools/run_slice3_vm.py", "corpora", "--cpus", "3", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }

[suite.cases."corpora-c4"]
argv = ["tools/run_slice3_vm.py", "corpora", "--cpus", "4", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }

[suite.cases."smp"]
argv = ["tools/run_slice3_vm.py", "smp", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 8, perf = true }
smoke = true

[suite.cases."limits"]
argv = ["tools/run_slice3_vm.py", "limits", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

[suite.cases."kicks"]
argv = ["tools/run_slice3_vm.py", "kicks", "--kicks", "1000", "--cpus", "1", "2", "4", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "host kicker threads against hot loops (boot-handoff §5: timing-sensitive)" }
smoke = true
rerun = true

[suite.cases."system"]
argv = ["tools/run_slice3_vm.py", "system", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

[suite.cases."coherence"]
argv = ["tools/run_slice3_vm.py", "coherence", "--reps", "1", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }
smoke = true

[suite.cases."sharedpt"]
argv = ["tools/run_slice3_vm.py", "sharedpt", "--reps", "1", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }
smoke = true

[suite.cases."litmus"]
argv = ["tools/run_slice3_vm.py", "litmus", "--k", "5000", "--runs", "1", "--parallel", "2", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 8, perf = true }
smoke = true

[suite.cases."contain"]
argv = ["tools/run_slice3_vm.py", "contain", "--fexc", "{fexc}", "--out", "{out}"]
needs = { exclusive = true, why = "wall-clock bounds: each failing run ends within 10 s (watchdog runs: + 5 s), a killed server within 2 s" }
smoke = true
rerun = true

[suite.cases."privilege"]
argv = ["env", "NATEMU_TEST_GUEST_STATE_ALIAS=0xffff407abcde0000", "python3", "tools/run_slice3_vm.py", "privilege", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

[suite.cases."delivery"]
argv = ["tools/run_slice3_vm.py", "delivery", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true

[suite.cases."events"]
argv = ["env", "NATEMU_TEST_GUEST_STATE_ALIAS=0xffff407abcde0000", "python3", "tools/run_slice3_vm.py", "events", "--kicks", "2000", "--fexc", "{fexc}", "--out", "{out}"]
needs = { perf = true }
smoke = true
