# The boot-time interpreter's per-instruction cases (docs/restructure/interp-cases.md): the generated corpus, its two
# references (the pinned QEMU's TCG and the x86 machine under KVM) and their checks. The `references` case compares the
# locked answers only: nothing starts a VM. `natemu` runs the corpus in natemu's interpreter (run_interp_natemu.py) and
# `natemu-machine` the program driver's machine descriptions with their expected fields, in 64-bit and interpreted modes.
[family]
name = "interp"
covers = ["tests/interp/**", "tests/lib/testenv.py", "tools/reference/answers.py", "tools/correctness/recipes/common.sh",
          "crates/**", "third_party/FEX"]

[[suite]]
name = "interp"
kind = "judged"
harness = "runner"
params = { timeout = 1800 }

# Every case's QEMU and KVM answers are locked and agree on every field both answer; the empty cases read back their
# starting state; every case stops where it means to. Seeding: TESTKIT_SEED_ANSWERS=1 NATEMU_X86_HOST=user@host, twice,
# then `natemu-test lock tests/interp --from-run RUN1 RUN2`.
[suite.cases."references"]
argv = ["tests/interp/run_interp_ref.py", "--out", "{out}"]
smoke = true

# The program driver's machine descriptions (the corpus's form: state set directly, physical memory, stops, readback)
# with the fields each must leave: in 64-bit mode (translated code: a landing stop, the first-instruction stop, the
# `machine` fields) and in the interpreted modes (the interpreter's memory, fetch and typed stops; run_interp_natemu.py).
[suite.cases."natemu-machine"]
argv = ["tests/interp/run_interp_natemu.py", "--selftest", "--jobs", "4", "--host", "{natemu_host}", "--runtime",
        "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4 }
smoke = true

# The corpus in natemu's interpreter against the locked answers; the cases listed in natemu-pending.txt stop at a
# resident operation not built yet (each must stop there, the typed stop naming it).
[suite.cases."natemu"]
argv = ["tests/interp/run_interp_natemu.py", "--pending", "tests/interp/natemu-pending.txt", "--jobs", "4", "--host",
        "{natemu_host}", "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4 }
