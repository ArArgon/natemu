# The boot-time interpreter's per-instruction cases (docs/restructure/interp-cases.md): the generated corpus, its two
# references (the pinned QEMU's TCG and the x86 machine under KVM) and their checks. The `references` case compares the
# locked answers only: nothing starts a VM. `natemu` runs the corpus in natemu's interpreter (run_interp_natemu.py) and
# `natemu-machine` the program driver's machine descriptions with their expected fields, in 64-bit and interpreted modes.
[family]
name = "interp"
covers = ["tests/interp/**", "tests/lib/testenv.py", "tools/reference/answers.py", "tools/correctness/recipes/common.sh",
          "tools/models/**", "crates/**", "third_party/FEX"]

[[suite]]
name = "interp"
kind = "judged"
harness = "runner"
params = { timeout = 1800 }

# Every case's QEMU and KVM answers are locked and agree on every field both answer; the empty cases read back their
# starting state; every case stops where it means to. Seeding: TESTKIT_SEED_ANSWERS=1 NATEMU_X86_HOST=user@host, twice,
# then `natemu-test lock tests/interp --from-run RUN1 RUN2`.
[suite.cases."references"]
argv = ["tests/interp/run_interp_ref.py", "--out", "{out}"]
smoke = true

# The program driver's machine descriptions (the corpus's form: state set directly, physical memory, stops, readback)
# with the fields each must leave: in 64-bit mode (translated code: a landing stop, the first-instruction stop, the
# `machine` fields) and in the interpreted modes (the interpreter's memory, fetch and typed stops; run_interp_natemu.py).
[suite.cases."natemu-machine"]
argv = ["tests/interp/run_interp_natemu.py", "--selftest", "--jobs", "4", "--host", "{natemu_host}", "--runtime",
        "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4 }
smoke = true

# The interpreter's fault and transition cases against the models (interp_faults.py): segment_model's far JMP, far RET
# and MOV Sreg in R, P16, P32 and C32 (the typed stop and record it gives with nothing committed, or the state it
# reaches), and modes_model's programs (where the model ends them: a fault, the paging-without-long-mode stop, the end).
[suite.cases."natemu-faults"]
argv = ["tests/interp/run_interp_natemu.py", "--faults", "--jobs", "4", "--host", "{natemu_host}", "--runtime",
        "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4 }

# The corpus in natemu's interpreter: every case against its locked answers.
[suite.cases."natemu"]
argv = ["tests/interp/run_interp_natemu.py", "--jobs", "4", "--host", "{natemu_host}", "--runtime", "{natemu_runtime}",
        "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4 }

# x86 ordering between an interpreting vCPU and a translated one (interp_litmus.py): message passing both ways, store
# buffering and load buffering, A in P32 (the interpreter's memory layer at EL1) and B in 64-bit code (translated, EL0),
# 100,000 iterations each; every outcome in tools/models/ordering_model.py's allowed set, and each pattern's overlap
# outcomes seen (the control: B landed between A's two accesses). Performance cores: an M1's efficiency cores lack TSO.
[suite.cases."natemu-litmus"]
argv = ["tests/interp/run_interp_natemu.py", "--litmus", "--k", "25000", "--runs", "4", "--host", "{natemu_host}",
        "--runtime", "{natemu_runtime}", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 2, perf = true }
