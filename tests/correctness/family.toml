[[suite]]
name = "gstr"
kind = "judged"
harness = "campaign"
tier = "campaign"
# 155 glibc string and wcsmbs programs, natively a few seconds; six parts, as the reference campaign ran them
# (docs/restructure/correctness-cpython-string.md:25)
parts = 6
cap = 3600
verdict = "verdicts:gstr"
matrix = { "machine.vcpus" = [4] }
needs = { cores = 4, perf = true }
smoke = ["part-5"]    # the smallest part: 25 of the 155 programs

[suite.expected]
"wcsmbs/tst-wcstod-round" = "natemu runs x87 in reduced precision: wcstold misses inexact flags for long double and _Float64x conversions (docs/restructure/correctness-cpython-string.md:154; a known observed incompatibility, not yet shown to follow from the accepted deviation)"

[[suite]]
name = "x86st"
kind = "judged"
harness = "campaign"
tier = "campaign"
# 49 kernel x86 selftests (25 64-bit programs and, since M2 checkpoint A, the 24 32-bit ones, `*_32`), one per boot,
# so a test that stops the VM ends only its own part (docs/restructure/correctness-x86-litmus.md:38); each test has
# a 300 s kill timeout in the guest
parts = 49
cap = 900
verdict = "verdicts:x86st"
matrix = { "machine.vcpus" = [4] }
needs = { cores = 4, perf = true }
smoke = ["part-34"]    # sysret_rip_64: one quick program that passes

[suite.expected]
"ldt_gdt_32" = "natemu runs 32-bit code only with flat DS and ES (M2 design, Segments; task 6): the last test loads DS with a read-only expand-down thread-area segment, which takes #GP(selector) at the next instruction; the test's SIGSEGV handler, left from an earlier test, then jumps back there for ever and the runner's 60 s timeout for this program ends it, exit 137 (docs/restructure/m2-checkpoint-a-findings.md)"
"sigreturn_32" = "natemu runs no 16-bit code segment (M2 design, Part 2): the sigreturns into 64-bit and 32-bit code pass, the third, into a 16-bit code segment, takes #GP(selector) and the process gets SIGSEGV, exit 139 (docs/restructure/m2-checkpoint-a-findings.md)"
"sigreturn_64" = "natemu runs no 16-bit code segment (M2 design, Part 2): the sigreturns into 64-bit and 32-bit code pass, the third, into a 16-bit code segment, takes #GP(selector) and the process gets SIGSEGV, exit 139 (docs/restructure/m2-checkpoint-a-findings.md)"
"sysret_ss_attrs_64" = "no far transfer between 32-bit and 64-bit code until M2 task 5: call32_from_64's far return to a 32-bit CS takes #GP and the process gets SIGSEGV, exit 139 (docs/restructure/correctness-x86-litmus.md:193; docs/restructure/m2-task3b-findings.md)"
"test_syscall_vdso_32" = "no far transfer between 32-bit and 64-bit code until M2 task 5: the test's far jump from 32-bit code to the 64-bit code segment takes #GP(30H) and the process gets SIGSEGV, exit 139 (docs/restructure/m2-checkpoint-a-findings.md)"
"test_shadow_stack_64" = "natemu's CPU profile has no CET shadow stacks: exit 1 after [SKIP] Could not enable Shadow stack, as on QEMU (docs/restructure/correctness-x86-litmus.md:61)"

[[suite]]
name = "torture32"
kind = "judged"
harness = "campaign"
tier = "campaign"
