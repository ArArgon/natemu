# The Linux workload campaigns (plan docs/superpowers/plans/2026-11-18-campaign-onboarding.md, Part B): each case boots
# one part of a campaign image under natemu and judges every test the image lists by the campaign's own verdict
# (verdicts.py). No reference run, no lock. testkit/harness/campaign.py describes the suite keys. The other campaigns
# (libm, gstr, x86st, ltp, cpyt, cpyb, stress, litmus, public) join with their recipes (plan Tasks 8-10).
[family]
name = "correctness"
covers = ["tools/correctness/**", "tests/correctness/**", "testkit/harness/campaign.py"]

[[suite]]
name = "openssl"
kind = "judged"
harness = "campaign"
tier = "campaign"
# 41 recipes x 6 capability masks = 246 runs, single-threaded: about 1,000 s at 4 vCPUs (correctness-userspace.md)
parts = 2
cap = 3600
verdict = "verdicts:openssl"
matrix = { "machine.vcpus" = [4] }
needs = { cores = 4, perf = true }

[[suite]]
name = "torture"
kind = "judged"
harness = "campaign"
tier = "campaign"
# 3,448 programs (1,724 tests at -O0 and -O2): about 170 s at 4 vCPUs (correctness-userspace.md)
parts = 1
cap = 3600
verdict = "verdicts:torture"
matrix = { "machine.vcpus" = [4] }
needs = { cores = 4, perf = true }

[suite.expected]
# docs/restructure/correctness-userspace.md, finding 1: an x87 register is a double, so FLD m80 of LDBL_MAX rounds to
# +inf and GCC's isinfl / x != inf / x == inf misjudge; these abort under natemu and pass natively and on QEMU.
"ieee_inf-2.O0" = "natemu runs x87 in reduced precision (FEX): LDBL_MAX loads as +inf (docs/restructure/correctness-userspace.md, finding 1)"
"ieee_inf-2.O2" = "natemu runs x87 in reduced precision (FEX): LDBL_MAX loads as +inf (docs/restructure/correctness-userspace.md, finding 1)"
"ieee_inf-3.O0" = "natemu runs x87 in reduced precision (FEX): LDBL_MAX loads as +inf (docs/restructure/correctness-userspace.md, finding 1)"
"ieee_inf-3.O2" = "natemu runs x87 in reduced precision (FEX): LDBL_MAX loads as +inf (docs/restructure/correctness-userspace.md, finding 1)"
"ieee_pr36332.O0" = "natemu runs x87 in reduced precision (FEX): LDBL_MAX loads as +inf (docs/restructure/correctness-userspace.md, finding 1)"
"ieee_pr36332.O2" = "natemu runs x87 in reduced precision (FEX): LDBL_MAX loads as +inf (docs/restructure/correctness-userspace.md, finding 1)"
"pr39228.O0" = "natemu runs x87 in reduced precision (FEX): isinfl misjudges LDBL_MAX (docs/restructure/correctness-userspace.md, finding 1)"
"pr39228.O2" = "natemu runs x87 in reduced precision (FEX): isinfl misjudges LDBL_MAX (docs/restructure/correctness-userspace.md, finding 1)"

[[suite]]
name = "public"
kind = "judged"
harness = "campaign"
tier = "campaign"
# docs/restructure/correctness-public-kernel.md: Linux 6.12.107 selftests, QEMU tests/tcg x86-64 programs and LTP tests
# on the stock Debian kernel, kernel test modules on a test kernel the recipe builds; one boot per row (88 rows; the
# image's public-boot.txt gives each row's kernel and guest cap, pubcap=300). The LKMM corpus is not built yet.
# public-campaign.py's classify judges each row: one that ran to the end with nothing checking its output is
# `unverified`, never passed (plan Decision 2).
parts = 88
cap = 450
verdict = "verdicts:public"
matrix = { "machine.vcpus" = [1, 4] }
needs = { cores = 4 }
# One part per kind, to show the campaign works end to end (`run --tier campaign ... -k "public and smoke"`):
# rseq-basic_test (selftest), qemu-cmpxchg (QEMU tests/tcg), ltp-mmap01 (LTP), kunit-memcpy_kunit (KUnit on the test
# kernel), kernel-test_bitmap (a test module), locktorture-spin_lock (a torture module).
smoke = ["part-0", "part-24", "part-62", "part-72", "part-75", "part-77"]

[suite.expected]
"ptrace-vmaccess" = "global.attach hits its 30 s internal timeout: a Linux 6.12.107 ptrace/exec wait cycle in the guest kernel, on QEMU too (docs/restructure/correctness-public-kernel.md, ptrace follow-up)"
"mm-mremap_test" = "the default guest fixture rejects the 2 GiB mappings (commit accounting) and the 40 MiB preamble (EEXIST); mm-mremap_test-overcommit-noaslr is the passing fixture (docs/restructure/correctness-public-kernel.md, defect list)"
"vmalloc-normal-cases" = "test_vmalloc returns -EAGAIN after printing its results by design, so modprobe exits non-zero (docs/restructure/correctness-public-kernel.md, resolved interpretation issue)"
