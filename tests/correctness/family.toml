# the guest runs /ct/run-cpy.sh. A module regrtest skipped whole (platform, missing Tk, a resource not enabled)
# reports no case: regrtest's own verdict for it decides (verdicts.cpyt_unreported).
# VSOCK (correctness-cpython-string.md, Every failed or errored case): ThreadedVSOCKSocketStreamTest errors natively
# only; the guest has no vsock device and test_socket skips the VSOCK classes, so test_socket is not `expected`
# (an entry would report unexpected-pass).
# smoke: part-6 (40 modules, among them test_zipfile, whose 1980 date check the image's mtimes now pass, and two
# modules skipped whole); its multiprocessing module is the light test_manager.
ct = "cpy"
parts = 12
cap = 3600
verdict = "verdicts:cpyt"
unreported = "verdicts:cpyt_unreported"
smoke = ["part-6"]
# Flaky at case level, not per module: verdicts.CPY_FLAKY_CASES, test_os's three TimerfdTests remaining-time cases
