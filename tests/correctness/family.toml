# stress-ng 0.19.02 with --verify, one boot per family of tools/correctness/stress-list.txt (recipes/stress/cases.py:
# seed 1, 4 instances per stressor, mix one each; the N=2 tails ipc1t and code1t left out): 18 parts, 153 stressor
# runs, each stopped by its op count or stress-ng's timeout. part_args are run-stress.sh's own options, appended to each
# part's word: scale=X runs round(OPS * X) operations per stressor, timeout=T is stress-ng's --timeout (outer kill
# T + 160 s). The original campaign is scale=1,timeout=240 over all 18 families, run on request: about 2 h 20 min of
# boots at 4 vCPUs (its N=4 boots took 1-13 min each on the M2; a 900 s cap per boot there,
# docs/restructure/correctness-stress.md). The cap here is 1,800 s: at full size ipc1, code1, split and split2 passed
# 900 s on the M3 (4 performance cores; run 20261119-043949-c2b0), and the cap only guards against a hang:
#   TESTKIT_PART_ARGS=stress:scale=1,timeout=240 tools/natemu-test run --tier campaign tests/correctness/family.toml -k stress
# (TESTKIT_PART_ARGS's `stress:` entry replaces this suite's part_args for that run; empty: none, run-stress.sh's
# defaults, the same). Here: a smoke setting that only proves the campaign works end to end. --tier campaign runs all
# 18 parts at it; the smoke list selects only mem1 (part-0, 12 stressors).
