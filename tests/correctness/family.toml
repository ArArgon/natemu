# the image there in a chroot). Also with AFP hidden (host.afp = false, NATEMU_FEXC_FEATURE_OFF=afp): x87 fast mode on
# a Mac without AFP differs, and expected_without.afp lists what fails only there; and in accurate mode there
# (rules.py: not with AFP, where it changes nothing), where those must pass. A failing program must fail exactly as
# recorded for its mode (libm32-fails-MODE.txt, verdicts.libm32: the hash of its whole output and exit status): an
# expected program hides no new failure, nor a case that fails by more.
reference = "x86"
ct = "libm"
parts = 1
cap = 3600
verdict = "verdicts:libm32"
answers = ["libm32.txt", "libm32-fails-afp.txt", "libm32-fails-noafp.txt", "libm32-fails-noafp-accurate.txt"]
matrix = { "machine.vcpus" = [4], "host.afp" = [true, false], "engine.fp" = ["fast", "accurate"] }
needs = { cores = 4, perf = true }
smoke = ["part-0"]    # its only part: about 95 s of guest time with AFP

