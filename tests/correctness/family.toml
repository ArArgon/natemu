[[suite]]
name = "stress"
kind = "judged"
harness = "campaign"
tier = "campaign"
# stress-ng 0.19.02 with --verify, one boot per family of tools/correctness/stress-list.txt (recipes/stress/cases.py:
# seed 1, 4 instances per stressor, mix one each; the N=2 tails ipc1t and code1t left out): 18 parts, 153 stressor
# runs, each stopped by its op count or stress-ng's timeout. part_args are run-stress.sh's own options, appended to each
# part's word: scale=X runs round(OPS * X) operations per stressor, timeout=T is stress-ng's --timeout (outer kill
# T + 160 s). The original campaign is scale=1,timeout=240 over all 18 families, run on request: about 2 h 20 min of
# boots at 4 vCPUs (its N=4 boots took 1-13 min each; 900 s cap per boot, docs/restructure/correctness-stress.md):
#   TESTKIT_PART_ARGS=scale=1,timeout=240 tools/natemu-test run --tier campaign tests/correctness/family.toml -k stress
# (TESTKIT_PART_ARGS replaces part_args for that run; empty: none, run-stress.sh's defaults, the same).
# Here: a smoke setting that only proves the campaign works end to end, and only mem1 (part-0, 12 stressors) is run.
parts = 18
cap = 900
part_args = "scale=0.05,timeout=20"
smoke = ["part-0"]
verdict = "verdicts:stress"
matrix = { "machine.vcpus" = [4] }
needs = { cores = 4, perf = true }

[suite.expected]
# docs/restructure/correctness-stress.md ("shm-sysv as root"): as root, stress-ng's shm-sysv does no bogo op before its
# timeout on this kernel, under natemu and QEMU alike (as nobody it does its ops in under a second); a run to the
# timeout with no operation fails the verdict, so these two root runs are expected to.
"shm-sysv.r1" = "stress-ng 0.19.02's shm-sysv as root does no operation on Linux 6.12.107, on natemu and QEMU alike (docs/restructure/correctness-stress.md, shm-sysv as root)"
"shm-sysv:root.r1" = "stress-ng 0.19.02's shm-sysv as root does no operation on Linux 6.12.107, on natemu and QEMU alike (docs/restructure/correctness-stress.md, shm-sysv as root)"

[[suite]]
name = "public"
kind = "judged"
harness = "campaign"
tier = "campaign"
# docs/restructure/correctness-public-kernel.md: Linux 6.12.107 selftests, QEMU tests/tcg x86-64 programs and LTP tests
# on the stock Debian kernel, kernel test modules on a test kernel the recipe builds; one boot per row (88 rows; the
# image's public-boot.txt gives each row's kernel and guest cap, pubcap=300). The LKMM corpus is not built yet.
# verdicts.py's public judges each row: passed on the program's own success signal, failed on a failure or a kernel
# splat, `unverified` when it ran to the end with nothing to say its output is right.
parts = 88
cap = 450
verdict = "verdicts:public"
matrix = { "machine.vcpus" = [1, 4] }
needs = { cores = 4 }
# One part per kind, to show the campaign works end to end (`run --tier campaign ... -k "public and smoke"`):
# rseq-basic_test (selftest), qemu-cmpxchg (QEMU tests/tcg), ltp-mmap01 (LTP), kunit-memcpy_kunit (KUnit on the test
# kernel), kernel-test_bitmap (a test module), locktorture-spin_lock (a torture module).
smoke = ["part-0", "part-24", "part-62", "part-72", "part-75", "part-77"]

[suite.expected]
"ptrace-vmaccess" = "global.attach hits its 30 s internal timeout: a Linux 6.12.107 ptrace/exec wait cycle in the guest kernel, on QEMU too (docs/restructure/correctness-public-kernel.md, ptrace follow-up)"
"mm-mremap_test" = "the default guest fixture rejects the 2 GiB mappings (commit accounting) and the 40 MiB preamble (EEXIST); mm-mremap_test-overcommit-noaslr is the passing fixture (docs/restructure/correctness-public-kernel.md, defect list)"
