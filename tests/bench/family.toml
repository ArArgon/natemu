# Benchmarks (spec R3.6): the tools/bench scripts and tests/bench/run_m1_perf.py, each alone on the machine; run only when named
# (`--tier bench`). Numbers are kept per machine and never compared across machines. The guest benchmarks' initramfs is
# built on the Mac from tools/bench/image (testkit/artifacts.py:bench_image); the kernel is Debian's pinned package.
[family]
name = "bench"
covers = ["tools/bench/**", "tests/bench/**", "tests/io/**", "tests/lib/**"]

[[suite]]
name = "bench"
kind = "bench"
harness = "bench"
tier = "bench"
params = { timeout = 7200 }

[suite.cases.micro-qemu]
argv = ["python3", "tools/bench/run_qemu.py", "--out", "{out}", "--reps", "3", "--no-linux-user"]

[suite.cases.micro-natemu]
argv = ["python3", "tools/bench/run_natemu.py", "--fexc", "{fexc}", "--out", "{out}", "--reps", "3"]

[suite.cases.smp-selftest]
argv = ["python3", "tools/bench/smp/smp.py", "selftest", "--out", "{out}"]

[suite.cases.smp-det]
argv = ["python3", "tools/bench/smp/smp.py", "det", "--out", "{out}", "--reps", "2", "--cpus", "2,4"]

[suite.cases.smp-litmus]
argv = ["python3", "tools/bench/smp/smp.py", "litmus", "--out", "{out}", "--runs", "3", "--tests", "sb,mp"]

[suite.cases.boot-natemu]
argv = ["python3", "tools/bench/boot.py", "--out", "{out}", "--name", "boot", "--emu", "natemu", "--vcpus", "1",
        "--kernel", "{kernel}", "--fexc", "{fexc}", "--natemu", "{natemu}", "--runtime", "{runtime}", "--cache", "off"]

[suite.cases.boot-qemu]
argv = ["python3", "tools/bench/boot.py", "--out", "{out}", "--name", "boot", "--emu", "qemu-multi", "--vcpus", "1",
