# The same compatibility user loop and linear addresses via flat DS, a limited FS and GS (variants flat, fs, gs: dword MOV
# loads and stores; each instruction's operand is checked inline), a flat-limit FS (fs-flat-limit: Linux's TLS shape, no
# check in the code), and a mix of other forms (mixed-flat, mixed-fs, mixed-fs-flat-limit: inc, add m,r, cmp m,imm, a byte
# load, a scalar SSE load). The guest TSC times each warmed loop within the VM, with its final words checked before
# recording the results.
[[suite]]
name = "compat-tls"
kind = "bench"
harness = "bench"
tier = "bench"
params = { timeout = 120 }

[suite.cases.compat-tls-natemu]
argv = ["python3", "tests/bench/run_compat_tls.py", "--out", "{out}", "--natemu", "{host}", "{runtime}", "{fexc}"]

# The Debian cloud-image workload (tests/io/run_io5.py, docs/benchmarks.md "Context-switch-heavy Debian workload") with its
# build timed alone (--solo-build: configure and make -j4 again after the run, without the download and disk loops):
# result.json's steps solo-configure and solo-make. Always 4 vCPUs, mitigations=off, as m1-perf's IO5 runs. About 15 minutes
# and the network (apt, kernel.org). The framework holds the machine, so the runner's own VM lock is a private file. A suite of
# its own (as m1-perf), so that preparing the other benchmarks never builds the IO5 inputs.
[[suite]]
name = "io5"
kind = "bench"
harness = "bench"
tier = "bench"
params = { timeout = 7200 }

[suite.cases.io5-solo]
argv = ["python3", "tests/io/run_io5.py", "run", "--backend", "natemu", "--inputs", "{io5_inputs}", "--out", "{out}/io5",
        "--natemu", "{natemu}", "--runtime", "{runtime}", "--fexc", "{fexc}", "--vcpus", "4", "--ram", "8", "--mitigations-off",
        "--solo-build", "--lock", "{out}/vm.lock"]

# The 32-bit toolchain build (M2 checkpoint B; run_io5.py --i386): in one boot, CPython's configure and make -j4 by the 64-bit
# userland (steps configure, make; nothing else running) and by a Debian i386 userland debootstrapped into /i386 (steps
# i386-configure, i386-make), whose python must then give the x86 reference machine's answers. -qemu: the same under QEMU TCG
# (its first boot is stopped at 45 minutes, the owner's bound: the steps finished by then are its result; once per version). -profile: natemu's timing log (perf-use.log; a profile, not a timing). -reference: the
# same boots on the x86 machine under KVM; prints the check's hash and x87 lines to pin in run_io5.py (I386_CHECK, I386_X87), and
# its step times are real x86's. `remote`: it uses none of this Mac's cores, takes no exclusive window, and runs only when
# seeding (TESTKIT_SEED_ANSWERS=1 NATEMU_X86_HOST=user@host), never in an ordinary bench round.
[suite.cases.io5-solo32]
argv = ["python3", "tests/io/run_io5.py", "run", "--backend", "natemu", "--inputs", "{io5_inputs}", "--out", "{out}/io5",
        "--natemu", "{natemu}", "--runtime", "{runtime}", "--fexc", "{fexc}", "--vcpus", "4", "--ram", "8", "--mitigations-off",
        "--i386", "--lock", "{out}/vm.lock"]

[suite.cases.io5-solo32-profile]
argv = ["python3", "tests/io/run_io5.py", "run", "--backend", "natemu", "--inputs", "{io5_inputs}", "--out", "{out}/io5",
        "--natemu", "{natemu}", "--runtime", "{runtime_perf}", "--fexc", "{fexc}", "--vcpus", "4", "--ram", "8", "--mitigations-off",
        "--i386", "--perf-log", "--lock", "{out}/vm.lock"]

[suite.cases.io5-solo32-qemu]
timeout = 3900
argv = ["python3", "tests/io/run_io5.py", "run", "--backend", "qemu", "--inputs", "{io5_inputs}", "--out", "{out}/io5",
        "--vcpus", "4", "--ram", "8", "--mitigations-off", "--i386", "--limit", "2700", "--lock", "{out}/vm.lock"]

[suite.cases.io5-solo32-reference]
remote = true                   # nothing runs or is timed on this Mac: not an exclusive window
argv = ["python3", "tests/io/run_io5.py", "run", "--backend", "kvm", "--inputs", "{io5_inputs}", "--out", "{out}/io5",
        "--vcpus", "4", "--ram", "8", "--mitigations-off", "--i386", "--lock", "{out}/vm.lock"]

# The M1 performance check (docs/m1-config-and-qcow2-design.md, "Performance check"; tests/bench/run_m1_perf.py): natemu at
# the baseline commit against this checkout's build, in fio matrix runs on raw, qcow2 and overlay disks plus IO5, judged
# by the driver (exit 0 only on PASS). About 80 minutes and 3-4 GiB of free disk. A suite of its own, so that preparing
# the other benchmarks never builds the baseline or the IO5 image. Its results folder ({resume_dir}) is kept per machine
# for these builds and inputs: running the case again resumes (finished runs are kept, failed ones are run again).
[[suite]]
name = "m1-perf"
kind = "bench"
harness = "bench"
tier = "bench"
params = { timeout = 7200 }

[suite.cases.m1-perf]
baseline = "ecec5d77"           # = run_m1_perf.py BASELINE_COMMIT; {natemu_baseline} is artifacts.natemu_at(baseline)
pieces = true                   # one case per planned run (`m1-perf/piece-NN`, --limit 1): about 2-15 min windows, not 80
argv = ["python3", "tests/bench/run_m1_perf.py", "full", "--dir", "{resume_dir}", "--retry-failed", "--baseline-build", "{natemu_baseline}",
        "--final-build", "{natemu_entry}", "--fexc", "{fexc}", "--fio-prep", "{fio_prep}", "--block-inputs", "{block_inputs}",
        "--inputs", "{resume_dir}/matrix-inputs", "--io5-inputs", "{io5_inputs}"]
env = { NATEMU_QEMU_IMG = "{qemu_img}" }

# A Paper (Minecraft server) start on 4 vCPUs and 2 GiB, a fixed 1 GiB Java heap (tests/bench/run_paper.py), air-gapped: the IO5 cloud image, the pinned
# JDK packages, Paper jar and Mojang jar (input paper-inputs); a setup boot (packages, world), then 3 boots of two timed starts
# each (median per start position); PTI off (--speculation-barriers, as the README advises). About 6 minutes. A suite of its own,
# so that preparing the other guest benchmarks never fetches the cloud image or the Paper inputs.
[[suite]]
name = "paper"
kind = "bench"
harness = "bench"
tier = "bench"
params = { timeout = 7200 }

[suite.cases.guest-paper]
argv = ["python3", "tests/bench/run_paper.py", "run", "--inputs", "{io5_inputs}", "--paper-inputs", "{paper_inputs}", "--out", "{out}",
        "--fexc", "{fexc}", "--natemu", "{natemu}", "--runtime", "{runtime}", "--vcpus", "4", "--ram", "2", "--starts", "2",
        "--boots", "3", "--speculation-barriers"]

# The same start on a host without FEAT_AFP (an M1 or M2), shown on any Mac: fexc is told the host lacks AFP
# (NATEMU_FEXC_FEATURE_OFF=afp, tests/features.toml's way of hiding it), so the code and the resident take the no-AFP paths.
[suite.cases.guest-paper-noafp]
argv = ["python3", "tests/bench/run_paper.py", "run", "--inputs", "{io5_inputs}", "--paper-inputs", "{paper_inputs}", "--out", "{out}",
        "--fexc", "{fexc}", "--natemu", "{natemu}", "--runtime", "{runtime}", "--vcpus", "4", "--ram", "2", "--starts", "2",
        "--boots", "3", "--speculation-barriers"]
env = { NATEMU_FEXC_FEATURE_OFF = "afp" }

# A profile, not a timing: guest-paper-noafp with one timed boot, the resident built with its `perf` feature and natemu's timing
# log of each boot (OUT/perf-PHASE.log: host time by part and exit kind, the resident's buckets, the translation requests and
# their parts, the fexc server's CPU time).
[suite.cases.guest-paper-noafp-profile]
argv = ["python3", "tests/bench/run_paper.py", "run", "--inputs", "{io5_inputs}", "--paper-inputs", "{paper_inputs}", "--out", "{out}",
        "--fexc", "{fexc}", "--natemu", "{natemu}", "--runtime", "{runtime_perf}", "--vcpus", "4", "--ram", "2", "--starts", "2",
        "--boots", "1", "--speculation-barriers", "--perf-log"]
env = { NATEMU_FEXC_FEATURE_OFF = "afp" }

# Four same-CPL far transfers per 64→32→64 user iteration. Both engines run identical program bytes.
[[suite]]
name = "mixed-far"
kind = "bench"
harness = "bench"
tier = "bench"
params = { timeout = 1500 }

[suite.cases.mixed-far-natemu]
argv = ["python3", "tools/bench/smp/smp.py", "mixed-cost", "--out", "{out}", "--natemu", "{host}", "{runtime}", "{fexc}"]

[suite.cases.mixed-far-qemu]
argv = ["python3", "tools/bench/smp/smp.py", "mixed-cost", "--out", "{out}"]
env = { NATEMU_QEMU_SYSTEM = "{qemu_system}" }

# Bochs display plan Task 4: kms_pattern (tests/devices/kms_pattern.c) copies 1 GiB of full 1024 x 768 frames into the
# mapped framebuffer and the same into guest RAM (the in-guest reference: the ratio shows the framebuffer runs at RAM
# speed), then natemu's runner takes 100 PNG snapshots through the control socket (mean time each). The control group:
# QEMU's bochs-display (TCG) on the same Mac, the same guest and program. tests/devices/run_display.py bench.
[[suite]]
name = "display"
kind = "bench"
harness = "bench"
tier = "bench"
params = { timeout = 1800 }

[suite.cases.display-fill]
argv = ["python3", "tests/devices/run_display.py", "bench", "--emu", "natemu", "--inputs", "{display_inputs}", "--out", "{out}",
        "--natemu", "{natemu}", "--runtime", "{runtime}", "--fexc", "{fexc}"]

[suite.cases.display-fill-qemu]
argv = ["python3", "tests/devices/run_display.py", "bench", "--emu", "qemu", "--inputs", "{display_inputs}", "--out", "{out}",
        "--qemu", "{qemu_system}"]
