# The Debian cloud-image workload (tests/io/run_io5.py, docs/benchmarks.md "Context-switch-heavy Debian workload") with its
# build timed alone (--solo-build: configure and make -j4 again after the run, without the download and disk loops):
# result.json's steps solo-configure and solo-make. Always 4 vCPUs, mitigations=off, as m1-perf's IO5 runs. About 15 minutes
# and the network (apt, kernel.org). The framework holds the machine, so the runner's own VM lock is a private file. A suite of
# its own (as m1-perf), so that preparing the other benchmarks never builds the IO5 inputs.
[[suite]]
name = "io5"
kind = "bench"
harness = "bench"
tier = "bench"
params = { timeout = 7200 }

[suite.cases.io5-solo]
argv = ["python3", "tests/io/run_io5.py", "run", "--backend", "natemu", "--inputs", "{io5_inputs}", "--out", "{out}/io5",
        "--natemu", "{natemu}", "--runtime", "{runtime}", "--fexc", "{fexc}", "--vcpus", "4", "--ram", "8", "--mitigations-off",
        "--solo-build", "--lock", "{out}/vm.lock"]

# The M1 performance check (docs/m1-config-and-qcow2-design.md, "Performance check"; tests/bench/run_m1_perf.py): natemu at
# the baseline commit against this checkout's build, in fio matrix runs on raw, qcow2 and overlay disks plus IO5, judged
# by the driver (exit 0 only on PASS). About 80 minutes and 3-4 GiB of free disk. A suite of its own, so that preparing
# the other benchmarks never builds the baseline or the IO5 image. Its results folder ({resume_dir}) is kept per machine
# for these builds and inputs: running the case again resumes (finished runs are kept, failed ones are run again).
[[suite]]
name = "m1-perf"
kind = "bench"
harness = "bench"
tier = "bench"
params = { timeout = 7200 }

[suite.cases.m1-perf]
baseline = "ecec5d77"           # = run_m1_perf.py BASELINE_COMMIT; {natemu_baseline} is artifacts.natemu_at(baseline)
pieces = true                   # one case per planned run (`m1-perf/piece-NN`, --limit 1): about 2-15 min windows, not 80
argv = ["python3", "tests/bench/run_m1_perf.py", "full", "--dir", "{resume_dir}", "--retry-failed", "--baseline-build", "{natemu_baseline}",
        "--final-build", "{natemu_entry}", "--fexc", "{fexc}", "--fio-prep", "{fio_prep}", "--block-inputs", "{block_inputs}",
        "--inputs", "{resume_dir}/matrix-inputs", "--io5-inputs", "{io5_inputs}"]
env = { NATEMU_QEMU_IMG = "{qemu_img}" }

# A Paper (Minecraft server) start on 4 vCPUs and 2 GiB, a fixed 1 GiB Java heap (tests/bench/run_paper.py), air-gapped: the IO5 cloud image, the pinned
# JDK packages, Paper jar and Mojang jar (input paper-inputs); a setup boot (packages, world), then 3 boots of two timed starts
# each (median per start position); PTI off (--speculation-barriers, as the README advises). About 6 minutes. A suite of its own,
# so that preparing the other guest benchmarks never fetches the cloud image or the Paper inputs.
[[suite]]
name = "paper"
kind = "bench"
harness = "bench"
tier = "bench"
params = { timeout = 7200 }

[suite.cases.guest-paper]
argv = ["python3", "tests/bench/run_paper.py", "run", "--inputs", "{io5_inputs}", "--paper-inputs", "{paper_inputs}", "--out", "{out}",
        "--fexc", "{fexc}", "--natemu", "{natemu}", "--runtime", "{runtime}", "--vcpus", "4", "--ram", "2", "--starts", "2",
        "--boots", "3", "--speculation-barriers"]
