# was on November 14 (130 s a run). vCPUs as the natemu case of the same name. Each boot (both runs) is capped at 10 minutes (the owner's bound); a
# capped boot is a result (bench.jsonl `capped`, `capped_in`, `at_least_s`), not a failure. Once per QEMU version.
[suite.cases.guest-hackbench32-qemu]
