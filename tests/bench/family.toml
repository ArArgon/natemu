# The cost of one resident trip to guest code (docs/restructure/el0-sampler-plan.md, chunk 3): the image's coldtrip program
# (CPUID every K iterations against an inline control, a small and a large code footprint, 100 ms halted gaps between phases)
# under the `perf` resident; tests/bench/coldtrip_report.py places each phase in the log's 5 ms bucket snapshots and gives
# the guest bucket's ns per trip: the gate's fixed cost and the cold state's (OUT/coldtrip.report.json). A profile, not a
# timing; its judge checks the program's sums, the trip counts against K and the resident's CPUID count.
[suite.cases.guest-coldtrip-profile]
argv = ["python3", "tests/bench/coldtrip_report.py", "run", "--out", "{out}", "--kernel", "{kernel}", "--initrd", "{bench_image}",
        "--fexc", "{fexc}", "--natemu", "{natemu}", "--runtime", "{runtime_perf}"]

# The bulk REP plan's kill-test (docs/restructure/bulk-rep-plan.md section 8): the image's repmicro programs (REP MOVSB, MOVSQ
# and 32-bit MOVSD rows: hot, short, declined; each about 50 ms three times) under the ordinary resident, 1 vCPU; ns per copy
# per row in OUT/repmicro.report.json (run 2's medians). Its judge checks every row's destination against a byte-by-byte
# copy (pinned at build time) in both runs; `tests/bench/repmicro_report.py compare` gives the kill-test over runs.
[suite.cases.guest-repmicro]
argv = ["python3", "tests/bench/repmicro_report.py", "run", "--out", "{out}", "--kernel", "{kernel}", "--initrd", "{bench_image}",
        "--fexc", "{fexc}", "--natemu", "{natemu}", "--runtime", "{runtime}"]

# Profiles, not timings: where the vCPUs were, sampled every 250 us (the EL0 sampler, docs/restructure/el0-sampler-plan.md
# chunk 0): the resident built with its `perf` and `profile` features, natemu --profile OUT/NAME (NAME.samples, NAME.objects),
# natemu.profile=1 on the kernel command line, the timing log. tests/bench/sample_report.py runs the boot, then writes
# NAME.report.json and NAME.report.md: samples by kind and place per phase (boot, run1 and its phases, run2, ...), the top blocks,
# and (chunk 1) block samples by word role and the top symbols: the kernel's from the booted bzImage's kallsyms, the user's by
# finding each block's guest bytes in the image's binaries. Their buckets are perturbed by sampling: reported, never a decision (the unperturbed -profile cases above decide).
[suite.cases.guest-build-sample]
argv = ["python3", "tests/bench/sample_report.py", "--profile", "{out}/build-sample", "--markers", "{out}/build-sample.markers.tsv", "--perf", "{out}/build-sample.perf", "--kernel-symbols", "{kernel_symbols}", "--boots", "{kernel}", "--image", "{bench_image}",
        "--", "python3", "tools/bench/run.py", "--out", "{out}", "--name", "build-sample", "--emu", "natemu", "--vcpus", "1", "--bench", "build",
        "--kernel", "{kernel}", "--initrd", "{bench_image}", "--fexc", "{fexc}", "--natemu", "{natemu}", "--runtime", "{runtime_profile}",
        "--compile-cache", "off", "--sample-us", "{sample_us}"]

[suite.cases.guest-hackbench-sample]
