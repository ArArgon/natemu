# Generated by `python3 -m testkit.migrate` from tools/run_suite.py (spec R13): the static runners, each case one
# unchanged runner invocation with inputs from the input root and QEMU answers locked. Edit run_suite.py and regenerate.
[family]
name = "static"
covers = ["crates/**", "third_party/FEX", "tools/**"]

[[suite]]
name = "static"
kind = "judged"
harness = "runner"
params = { timeout = 3600 }

[suite.cases."stack"]
argv = ["tools/check_resident_stack.py"]
needs = { perf = true }
smoke = true

[suite.cases."barriers"]
argv = ["tools/check_resident_barriers.py"]
needs = { perf = true }
smoke = true
