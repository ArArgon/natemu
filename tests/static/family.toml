# The static family's runner cases: each runs one script in this folder (or tests/lib) unchanged, with its inputs from
# the framework's input root and its QEMU answers locked in tests.lock (docs/testing.md, tests/README.md).
[family]
name = "static"
covers = ["crates/**", "third_party/FEX", "tools/**", "tests/static/**", "tests/lib/**"]

[[suite]]
name = "static"
kind = "judged"
harness = "runner"
params = { timeout = 3600 }

[suite.cases."stack"]
argv = ["tests/static/check_resident_stack.py"]
needs = { perf = true }
smoke = true

[suite.cases."barriers"]
argv = ["tests/static/check_resident_barriers.py"]
needs = { perf = true }
smoke = true

# The compiler's own checks on the code fexc emits, no VM. Each judges itself and is judged here by its exit status; test_fexc.py and test_slice1.py are
# unittest files (tools/fexc is not a package, so the unit family's discovery does not load them).
[[suite]]
name = "fexc"
kind = "judged"
harness = "runner"
params = { timeout = 3600 }

[suite.cases."fexc-smoke"]
argv = ["tools/fexc/smoke.py", "{fexc}", "{out}"]
smoke = true

[suite.cases."fexc-sites"]
# --known-ok: the default profile's eliminated compare loads are reported, not failed (check_sites.py's header)
argv = ["tools/fexc/check_sites.py", "--known-ok", "{fexc}"]

[suite.cases."fexc-sites-slice1"]
argv = ["tools/fexc/check_sites.py", "--slice1", "{fexc}"]
smoke = true

# verify_precision.py in four shards (--shard I/N: every 4th program of each corpus): the programs are checked one by one,
# independently, and as one case the check ran 6 to 7 minutes on one core.
[suite.cases."fexc-precision-0"]
argv = ["env", "FEXC={fexc}", "python3", "tools/fexc/verify_precision.py", "--shard", "0/4"]

[suite.cases."fexc-precision-1"]
argv = ["env", "FEXC={fexc}", "python3", "tools/fexc/verify_precision.py", "--shard", "1/4"]

[suite.cases."fexc-precision-2"]
argv = ["env", "FEXC={fexc}", "python3", "tools/fexc/verify_precision.py", "--shard", "2/4"]

[suite.cases."fexc-precision-3"]
argv = ["env", "FEXC={fexc}", "python3", "tools/fexc/verify_precision.py", "--shard", "3/4"]

# M2: the same checks on 32-bit code (--bitness 32): its own single-instruction forms and programs (PROGRAMS32).
[suite.cases."fexc-precision-32"]
argv = ["env", "FEXC={fexc}", "python3", "tools/fexc/verify_precision.py", "--bits32"]

# M2: FEX's 32-bit ASM suite (245 tests), offline: every reachable block compiled for 32-bit code and admitted by the
# host with the code-shape check. Running them waits for 32-bit code in the VM (M2 task 3).
[suite.cases."fexc-asm32"]
argv = ["tools/fexc/upstream_tests/run_asm.py", "--compile32", "--jobs", "4", "--fexc", "{fexc}", "--host", "{natemu_host}", "--out", "{out}",
        "--src", "{fex_asm}/../32Bit_ASM"]
needs = { cores = 4 }
smoke = true

# The replay gate (tools/fexc/README.md): the requests of one recorded boot (1 vCPU, to a busybox power-off), answered by
# the compiler of this checkout's merge base with main and by this checkout's: every reply identical. A change that means
# to alter 64-bit output fails here by design; such a change says so and is judged by the other suites. The boot also
# runs boot-i386's 32-bit program (M2 checkpoint A): the stream mixes both modes, the new compiler answers all of it
# and the old one the 64-bit requests (replay.py, --program32).
[suite.cases."fexc-replay"]
argv = ["tools/fexc/replay.py", "--fexc", "{fexc}", "--old", "{fexc_base}", "--stub", "{natemu_stub}", "--runtime", "{natemu_runtime}",
        "--kernel", "{raw}/kernel-census-20261028-01/dl/linux", "--initrd", "{raw}/kernel-census-20261028-01/dl/initrd.gz", "--out", "{out}",
        "--program32", "tests/boot/i386_static.asm"]
needs = { cores = 2, perf = true }

# The same stream answered twice by the new compiler, one process answering every request and one only the 64-bit ones: a
# 64-bit reply does not depend on the 32-bit requests answered before it. (fexc-replay showed this as a by-product while
# OLD and NEW gave the same replies; since M2 task 4's split stubs they differ, within replay.py's `only_probes`.)
# --old32: a third process answers the 32-bit requests, compared with NEW's by `only_moves` (identical here), so the
# comparison and its mutation check run on every boot's 32-bit replies.
[suite.cases."fexc-replay-order"]
argv = ["tools/fexc/replay.py", "--fexc", "{fexc}", "--old", "{fexc}", "--old32", "{fexc}", "--stub", "{natemu_stub}", "--runtime", "{natemu_runtime}",
        "--kernel", "{raw}/kernel-census-20261028-01/dl/linux", "--initrd", "{raw}/kernel-census-20261028-01/dl/initrd.gz", "--out", "{out}",
        "--program32", "tests/boot/i386_static.asm"]
needs = { cores = 2, perf = true }

[suite.cases."fexc-skips"]
argv = ["tools/fexc/scan_skips.py", "{fexc}"]

[suite.cases."fexc-serve"]
argv = ["tools/fexc/test_serve.py", "{fexc}"]

[suite.cases."fexc-channel"]
argv = ["tools/fexc/test_channel.py", "{fexc}"]
smoke = true

[suite.cases."fexc-unit"]
argv = ["env", "FEXC={fexc}", "python3", "-B", "-m", "unittest", "tools/fexc/test_fexc.py"]
smoke = true

# test_slice1.py, one case per test class: the classes are independent (each process builds its own native helper and
# keeps its own compile cache), and as one case its 92 tests ran 8 to 9 minutes on one core. testkit/tests/test_layout.py
# checks that the cases name every class of the file.
[suite.cases."fexc-slice1-cutting"]
argv = ["env", "FEXC={fexc}", "python3", "-B", "-m", "unittest", "--durations", "0", "tools.fexc.test_slice1.Slice1Cutting"]

[suite.cases."fexc-slice1-afp-flush"]
