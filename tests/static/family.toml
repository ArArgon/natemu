# Generated by `python3 -m testkit.migrate` from tools/run_suite.py (spec R13): the static runners, each case one
# unchanged runner invocation with inputs from the input root and QEMU answers locked. Edit run_suite.py and regenerate. Only the `static` suite is
# generated: `fexc` below is written by hand, and regenerating overwrites this file, so put it back
# (testkit/tests/test_runner.py checks it is here).
[family]
name = "static"
covers = ["crates/**", "third_party/FEX", "tools/**"]

[[suite]]
name = "static"
kind = "judged"
harness = "runner"
params = { timeout = 3600 }

[suite.cases."stack"]
argv = ["tools/check_resident_stack.py"]
needs = { perf = true }
smoke = true

[suite.cases."barriers"]
argv = ["tools/check_resident_barriers.py"]
needs = { perf = true }
smoke = true

# The compiler's own checks on the code fexc emits, no VM: tools/run_suite.py never ran these scripts (they were run by
# hand). Each judges itself and is judged here by its exit status; test_fexc.py and test_slice1.py are
# unittest files (tools/fexc is not a package, so the unit family's discovery does not load them).
[[suite]]
name = "fexc"
kind = "judged"
harness = "runner"
params = { timeout = 3600 }

[suite.cases."fexc-smoke"]
argv = ["tools/fexc/smoke.py", "{fexc}", "{out}"]
smoke = true

[suite.cases."fexc-sites"]
# --known-ok: the default profile's eliminated compare loads are reported, not failed (check_sites.py's header)
argv = ["tools/fexc/check_sites.py", "--known-ok", "{fexc}"]

[suite.cases."fexc-sites-slice1"]
argv = ["tools/fexc/check_sites.py", "--slice1", "{fexc}"]
smoke = true

[suite.cases."fexc-precision"]
argv = ["env", "FEXC={fexc}", "python3", "tools/fexc/verify_precision.py"]

[suite.cases."fexc-skips"]
argv = ["tools/fexc/scan_skips.py", "{fexc}"]

[suite.cases."fexc-serve"]
argv = ["tools/fexc/test_serve.py", "{fexc}"]

[suite.cases."fexc-channel"]
argv = ["tools/fexc/test_channel.py", "{fexc}"]
smoke = true

[suite.cases."fexc-unit"]
argv = ["env", "FEXC={fexc}", "python3", "-B", "-m", "unittest", "tools/fexc/test_fexc.py"]
smoke = true

[suite.cases."fexc-slice1"]
argv = ["env", "FEXC={fexc}", "python3", "-B", "-m", "unittest", "tools/fexc/test_slice1.py"]
