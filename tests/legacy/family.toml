# tools/run_suite.py's steps that no family has replaced yet, run unchanged (spec R13.1): claims from run_suite's
# SERIAL_WHY and E_OK tables, smoke from its QUICK list, the pass rule its own. Every result is labelled `wrapped`;
# these steps still use natemu-raw and live QEMU. Move a step to a family, then list it here under `replaced`.
[family]
name = "legacy"
covers = ["crates/**", "tools/**", "third_party/FEX"]

[[suite]]
name = "steps"
kind = "legacy"
harness = "legacy"
params = { replaced = ["i8", "i8b", "i8-m2f", "i8b-m2f", "i8-m2a", "i8b-m2a"], timeout = 3600 }
