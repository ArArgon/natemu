# The system family's runner cases: each runs one script in this folder (or tests/lib) unchanged, with its inputs from
# the framework's input root and its QEMU answers locked in tests.lock (docs/testing.md, tests/README.md).
[family]
name = "system"
covers = ["crates/**", "third_party/FEX", "tools/**", "tests/system/**", "tests/smp/**", "tests/faults/**", "tests/lib/**", "tests/boot/exit_ap.inc"]

[[suite]]
name = "system"
kind = "judged"
harness = "runner"
params = { timeout = 3600 }

[suite.cases."icebp"]
argv = ["tests/system/run_icebp.py", "--fexc", "{fexc}", "--out", "{out}"]
smoke = true

[suite.cases."instruction-gaps"]
argv = ["tests/system/run_instruction_gaps.py", "--max-block", "0", "--fexc", "{fexc}", "--out", "{out}"]
smoke = true

[suite.cases."instruction-gaps-1"]
argv = ["tests/system/run_instruction_gaps.py", "--max-block", "1", "--fexc", "{fexc}", "--out", "{out}"]

[suite.cases."frame-alias"]
argv = ["tests/system/run_frame_alias.py", "--guest-state-alias", "0xffff407abcde0000", "--fexc", "{fexc}", "--out", "{out}"]
smoke = true

[suite.cases."frame-alias-1"]
argv = ["tests/system/run_frame_alias.py", "--max-block", "1", "--guest-state-alias", "0xffff407abcde0000", "--fexc", "{fexc}", "--out", "{out}"]

[suite.cases."frame-randomization"]
