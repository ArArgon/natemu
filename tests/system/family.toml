# M2 Part 2: INIT and SIPI, each scenario of tools/models/initsipi_model.py judged against its reference
# (docs/restructure/initsipi-resident.md). The entry regime (NATEMU_INTERPRETER=off): each start state observed at the
# boot-time interpreter's entry.
[suite.cases."initsipi"]
argv = ["tests/system/run_initsipi.py", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4, perf = true }
smoke = true

[suite.cases."initsipi-1"]
argv = ["tests/system/run_initsipi.py", "--max-block", "1", "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4, perf = true }

# The interpreter regime (the interpreter runs each AP from its SIPI through the stub's climb to 64-bit mode; a start
# counts at its arrival on the stub page): every scenario but bsp-init, which is the entry regime's alone.
[suite.cases."initsipi-interpreter"]
argv = ["tests/system/run_initsipi.py", "--regime", "interpreter", "--only",
        "linux,sipi-sipi,kvm-unit-tests,edk2,edk2-back-to-back,init-sipi-init,sipi-then-init,sipi-before-init-taken,sipi-during-host-request,init-in-mailbox,init-in-translated-hlt,nmi-in-wfs,nmi-held,nmi-init-in-wfs,park-with-init,never-started,fixed-in-wfs,one-cpu",
        "--fexc", "{fexc}", "--out", "{out}"]
needs = { cores = 4, perf = true }

