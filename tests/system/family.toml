# Generated by `python3 -m testkit.migrate` from tools/run_suite.py (spec R13): the system runners, each case one
# unchanged runner invocation with inputs from the input root and QEMU answers locked. Edit run_suite.py and regenerate.
[family]
name = "system"
covers = ["crates/**", "third_party/FEX", "tools/**"]

[[suite]]
name = "system"
kind = "judged"
harness = "runner"
params = { timeout = 3600 }

[suite.cases."icebp"]
argv = ["tools/run_icebp.py", "--fexc", "{fexc}", "--out", "{out}"]
smoke = true

[suite.cases."instruction-gaps"]
